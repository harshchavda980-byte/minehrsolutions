<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Biometric Devices — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .device-status {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-trial { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .status-house { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
        .status-active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-damaged { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .device-filters-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .filter-card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-card label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-card select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-card select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .premium-table-container table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .premium-table-container th {
            text-align: left;
            padding: 15px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 800;
        }

        .premium-table-container td {
            padding: 18px 15px;
            background: rgba(255, 255, 255, 0.02);
            vertical-align: middle;
            border-top: 1px solid transparent;
            border-bottom: 1px solid transparent;
        }

        .premium-table-container tr td:first-child { border-left: 1px solid transparent; border-radius: 15px 0 0 15px; }
        .premium-table-container tr td:last-child { border-right: 1px solid transparent; border-radius: 0 15px 15px 0; }

        .premium-table-container tr:hover td {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--glass-border);
        }

        .btn-device-action {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-edit { background: rgba(99, 102, 241, 0.1); color: var(--primary); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .btn-status { background: var(--primary); color: #fff; padding: 0 12px; width: auto; font-size: 10px; font-weight: 700; border-radius: 8px; }
        .btn-timeline { background: #f59e0b; color: #fff; padding: 0 12px; width: auto; font-size: 10px; font-weight: 700; border-radius: 8px; }

        .btn-device-action:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .search-box-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            align-items: center;
            gap: 15px;
        }

        .premium-search {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 12px;
            width: 300px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search operations, companies..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown"></div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-header">
                    <div>
                        <h1 style="font-weight: 800; font-family: 'Outfit', sans-serif; font-size: 2.5rem; letter-spacing: -1px; color: var(--text-primary);">Manage Biometric Devices</h1>
                        <p style="color: var(--text-secondary); font-size: 1.1rem; opacity: 0.8;">Centrally manage and track biometric hardware assets across companies.</p>
                    </div>
                    <button class="btn btn-primary" onclick="openAddDeviceModal()" style="padding: 12px 28px; border-radius: 12px; font-weight: 700; background: var(--primary); border: none; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);">
                        + ADD DEVICE
                    </button>
                </div>

                <div class="device-filters-grid">
                    <div class="filter-card">
                        <label>Device Type</label>
                        <select id="filterType" onchange="loadDevices()">
                            <option value="All">All Types</option>
                            <option value="Mini">Mini</option>
                            <option value="Prime">Prime</option>
                        </select>
                    </div>
                    <div class="filter-card">
                        <label>City Location</label>
                        <select id="filterCity" onchange="loadDevices()">
                            <option value="All">All Cities</option>
                        </select>
                    </div>
                    <div class="filter-card">
                        <label>Deployment Status</label>
                        <select id="filterStatus" onchange="loadDevices()">
                            <option value="All">All Status</option>
                            <option value="In Trial">In Trial</option>
                            <option value="In House">In House</option>
                            <option value="Active">Active</option>
                            <option value="Damaged">Damaged</option>
                        </select>
                    </div>
                </div>

                <div class="panel">
                    <div class="search-box-container">
                        <label style="font-size: 12px; font-weight: 700; color: var(--text-muted);">SEARCH:</label>
                        <input type="text" id="deviceSearch" class="premium-search" placeholder="Search device ID, IMEI, or company..." oninput="debounceLoad()">
                    </div>
                    
                    <div class="premium-table-container">
                        <table id="deviceTable">
                            <thead>
                                <tr>
                                    <th>Sr.No</th>
                                    <th>Device ID</th>
                                    <th>IMEI No</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>City Name</th>
                                    <th>Assigned Company</th>
                                    <th>Installed By</th>
                                    <th>Admin</th>
                                    <th>Date</th>
                                    <th style="text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="deviceTableBody">
                                <tr><td colspan="11" class="text-center">Loading biometric assets...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination-container" id="pagination"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/manage-devices.js"></script>
</body>

</html>
