<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Listings — MineHR ATS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }

        .filter-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        .status-open { background: #dcfce7; color: #166534; }
        .status-closed { background: #fee2e2; color: #991b1b; }
        .status-on-hold { background: #fef9c3; color: #854d0e; }

        @media (max-width: 768px) {
            .filter-row { flex-direction: column; align-items: stretch; }
            .filter-row .form-group { width: 100%; }
            .page-title { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .modal-content { width: 95% !important; padding: 15px !important; }
        }

        @media (min-width: 2000px) {
            .admin-layout { max-width: 2400px; margin: 0 auto; }
            .premium-table-container { font-size: 1.1rem; }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search jobs..." oninput="document.getElementById('searchInput').value = this.value; loadJobs(1)" />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Job Listings</h1>
                        <p>Create and manage job openings across departments and locations.</p>
                    </div>
                    <button class="btn btn-primary" onclick="openJobModal()">+ Post New Job</button>
                </div>

                <div class="filter-row">
                    <div class="form-group">
                        <label>Search Job</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Title, ID, or Dept..." oninput="loadJobs(1)">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusFilter" class="form-control" onchange="loadJobs(1)">
                            <option value="">All Statuses</option>
                            <option value="Open">Open</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 0.5; min-width: 120px;">
                        <button class="btn btn-outline" onclick="resetFilters()" style="width: 100%; height: 45px;">Reset</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Job ID</th>
                                    <th>Title / Role</th>
                                    <th>Department</th>
                                    <th>Location</th>
                                    <th>Recruiter</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="jobTableBody"></tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination" style="margin-top: 20px; justify-content: flex-end;"></div>
                </div>

                <!-- Job Modal -->
                <div id="jobModal" class="modal">
                    <div class="modal-content glass" style="max-width: 650px;">
                        <div class="modal-header">
                            <h2 id="modalTitle">Post New Job</h2>
                            <button class="close-modal" onclick="closeModal('jobModal')">&times;</button>
                        </div>
                        <form id="jobForm" onsubmit="handleJobSubmit(event)">
                            <div class="modal-body">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                    <div class="form-group">
                                        <label>Job Title *</label>
                                        <input type="text" id="jobTitle" class="form-control" required placeholder="e.g. Senior Node.js Developer">
                                    </div>
                                    <div class="form-group">
                                        <label>Department *</label>
                                        <input type="text" id="jobDept" class="form-control" required placeholder="e.g. Engineering">
                                    </div>
                                    <div class="form-group">
                                        <label>Location (Country)</label>
                                        <select id="countrySelect" class="form-control">
                                            <option value="">Select Country</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Location (State)</label>
                                        <select id="stateSelect" class="form-control" disabled>
                                            <option value="">Select State</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Location (City) *</label>
                                        <select id="citySelect" class="form-control" required disabled>
                                            <option value="">Select City</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Hiring Manager / Recruiter</label>
                                        <select id="recruiterSelect" class="form-control">
                                            <option value="">Select Recruiter</option>
                                        </select>
                                    </div>
                                    <div class="form-group" style="grid-column: span 2;">
                                        <label>Status</label>
                                        <select id="jobStatus" class="form-control">
                                            <option value="Open">Open</option>
                                            <option value="On Hold">On Hold</option>
                                            <option value="Closed">Closed</option>
                                        </select>
                                    </div>
                                    <div class="form-group" style="grid-column: span 2;">
                                        <label>Job Description</label>
                                        <textarea id="jobDesc" class="form-control" rows="4" placeholder="Describe the role and responsibilities..."></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer" style="margin-top: 20px;">
                                <button type="submit" class="btn btn-primary" id="saveBtn">Post Job Opening</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/location-helper.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/ats-jobs.js"></script>
</body>

</html>
