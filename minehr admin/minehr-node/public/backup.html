<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RECYCLE BIN — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .recycle-item-type {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .type-company { background: rgba(99, 102, 241, 0.1); color: #6366f1; }
        .type-user { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .type-intimation { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">☀️</div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin" alt="Admin" style="width: 42px; height: 42px; border-radius: 14px;" />
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title">
                    <h1>Recycle Bin</h1>
                    <p>Recover deleted companies, users, and automations. Items stay for 180 days (6 months).</p>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Type</th>
                                    <th>Identity</th>
                                    <th>Deleted At</th>
                                    <th>Days Remaining</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recycleBinTableBody">
                                <tr><td colspan="5" style="text-align:center; padding: 40px;">Loading bin...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const authRes = await fetch("/api/auth/me");
            if (!authRes.ok) { window.location.href = "/login"; return; }
            loadBin();
        });

        async function loadBin() {
            try {
                const res = await fetch('/api/backup/items');
                const data = await res.json();
                if (data.success) {
                    renderBin(data.items);
                }
            } catch (err) { console.error(err); }
        }

        function renderBin(items) {
            const tbody = document.getElementById('recycleBinTableBody');
            if (!items || !items.length) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 60px; color: var(--text-muted);">Recycle bin is empty.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const delDate = new Date(item.deleted_at);
                const expiryDate = new Date(delDate);
                expiryDate.setMonth(expiryDate.getMonth() + 6);
                const daysRemaining = Math.max(0, Math.floor((expiryDate - new Date()) / (1000 * 60 * 60 * 24)));

                return `
                    <tr>
                        <td><span class="recycle-item-type type-${item.type.toLowerCase()}">${item.type}</span></td>
                        <td><strong>${item.name}</strong> <small style="color: var(--text-muted);">#${item.id}</small></td>
                        <td>${delDate.toLocaleDateString()} ${delDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                        <td><span style="font-weight: 600; color: ${daysRemaining < 15 ? '#ef4444' : 'inherit'}">${daysRemaining} Days</span></td>
                        <td style="text-align: right;">
                            <button class="btn btn-primary btn-sm" onclick="restoreItem('${item.type}', ${item.id})">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 5px;"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
                                Restore
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function restoreItem(type, id) {
            if (!confirm(`Restore this ${type}?`)) return;
            try {
                const res = await fetch(`/api/backup/restore/${type}/${id}`, { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    loadBin();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
