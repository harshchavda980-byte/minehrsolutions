<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Banner Management — MineHR Master</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .banner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }
        .banner-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition);
        }
        .banner-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .banner-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .banner-content {
            padding: 20px;
        }
        .banner-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .banner-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="page-loader" id="pageLoader"></div>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" oninput="filterBanners()" placeholder="Search banners..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h1>Banner Management</h1>
                            <p>Manage promotional banners for the dashboard and applications</p>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="seedBanners()" class="btn btn-outline">Seed Default Banners</button>
                            <a href="banners-create" class="btn btn-primary">Add New Banner</a>
                        </div>
                    </div>
                </div>

                <div id="bannersList" class="banner-grid">
                    <!-- Banners will be loaded here -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        

        async function fetchBanners() {
            const res = await fetch('/api/banners');
            const banners = await res.json();
            const list = document.getElementById('bannersList');
            const defaultTitles = ["Premium HR Solutions", "Global Talent Management", "Enterprise Analytics"];
            
            list.innerHTML = banners.map(b => {
                const isDefault = defaultTitles.includes(b.title);
                return `
                <div class="banner-card">
                    <img src="${b.image_url}" class="banner-img" onerror="this.src='https://via.placeholder.com/400x200?text=Invalid+Image'">
                    <div class="banner-content">
                        <div class="banner-title" style="display: flex; align-items: center; justify-content: space-between;">
                            <span>${b.title}</span>
                            ${isDefault ? '<span class="badge" style="background: var(--primary); color: #fff; font-size: 10px; padding: 2px 6px;">DEFAULT</span>' : ''}
                        </div>
                        <div style="font-size: 12px; color: var(--text-muted);">Status: <span class="badge ${b.status === 'active' ? 'badge-success' : 'badge-danger'}">${b.status}</span></div>
                        <div class="banner-actions">
                            <button onclick="editBanner(${b.id})" class="btn btn-outline btn-sm">Edit</button>
                            ${!isDefault ? `<button onclick="deleteBanner(${b.id})" class="btn btn-outline btn-sm" style="color: var(--danger);">Delete</button>` : ''}
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        async function seedBanners() {
            const res = await fetch('/api/banners/seed');
            if (res.ok) fetchBanners();
        }

        async function deleteBanner(id) {
            if (confirm('Delete this banner?')) {
                await fetch(`/api/banners/${id}`, { method: 'DELETE' });
                fetchBanners();
            }
        }

        function filterBanners() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.banner-card');
            cards.forEach(card => {
                const title = card.querySelector('.banner-title').innerText.toLowerCase();
                card.style.display = title.includes(filter) ? '' : 'none';
            });
        }

        function editBanner(id) { window.location.href = `banners-create?id=${id}`; }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            fetchBanners();
        });
    </script>
</body>

</html>
