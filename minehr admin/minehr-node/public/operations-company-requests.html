<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Not Found Requests — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
            background: transparent;
            color: var(--text-secondary);
        }

        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .filters-panel {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav">
                <!-- Sidebar content injected by sidebar.js -->
            </nav>
        </aside>
        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo">
                        <img src="logo.png" alt="MineHR Logo" />
                    </a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="topbarSearch"
                            oninput="document.getElementById('searchInput').value = this.value; filterRequests()"
                            placeholder="Search requests..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span>
                        <span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div style="text-align: right; display: flex; flex-direction: column;">
                                <span id="userName" style="font-size: 14px; font-weight: 600;">Admin</span>
                                <span id="userRole" style="font-size: 11px; color: var(--text-muted);">Super
                                    Admin</span>
                            </div>
                            <img id="userAvatar"
                                src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin"
                                style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content active-page">
                <div class="page-title">
                    <h1>Company Not Found Requests</h1>
                    <p>Manage user enquiries for companies missing from the platform.</p>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab('Pending')">Pending Requests</div>
                    <div class="tab" onclick="switchTab('Solved')">Solved Enquiries</div>
                </div>

                <div class="filters-panel">
                    <div class="form-group">
                        <label>Search Name / Company / Email</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search..."
                            oninput="filterRequests()">
                    </div>
                    <div class="form-group">
                        <label>Request Type</label>
                        <select id="typeFilter" class="form-control" onchange="filterRequests()">
                            <option value="">All Types</option>
                            <option value="App Support">App Support</option>
                            <option value="Sales">Sales</option>
                            <option value="Technical">Technical</option>
                        </select>
                    </div>
                    <div></div>
                    <button class="btn btn-outline" onclick="resetFilters()" style="height: 45px;">Reset</button>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Requester</th>
                                    <th>Company Detail</th>
                                    <th>Contact Info</th>
                                    <th>Type & Source</th>
                                    <th>Location</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="requestTableBody">
                                <!-- Data injected by JS -->
                            </tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination"
                        style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;"></div>
                </div>

                <!-- Detail Modal -->
                <div id="requestModal" class="modal">
                    <div class="modal-content glass">
                        <div class="modal-header">
                            <h2 id="modalReqId">Request Details</h2>
                            <button class="close-modal" onclick="closeModal()">&times;</button>
                        </div>
                        <div class="preview-grid" id="modalBody">
                            <!-- Details injected by JS -->
                        </div>
                        <div class="modal-footer"
                            style="margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end;">
                            <button id="modalSolveBtn" class="btn btn-primary success">Mark Solved</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/company-requests.js"></script>
</body>

</html>
