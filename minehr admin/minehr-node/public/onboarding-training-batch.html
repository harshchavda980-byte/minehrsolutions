<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Training Batches — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css"/>
    <style>
        :root {
            --primary-ob: #6366f1;
            --primary-ob-glow: rgba(99, 102, 241, 0.4);
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        .ob-page-hero { margin-bottom: 30px; }
        .ob-breadcrumb {
            display: flex; align-items: center; gap: 8px;
            font-size: 10px; color: var(--text-muted); font-weight: 800;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
        }
        .ob-breadcrumb span { color: var(--primary-ob); }
        .ob-page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem; font-weight: 800; letter-spacing: -1px; margin: 0;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .ob-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
        }

        .ob-card-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,255,255,0.01);
        }

        .ob-table { width: 100%; border-collapse: collapse; }
        .ob-table th {
            padding: 18px 24px; text-align: left;
            font-size: 11px; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--border-glass);
        }
        .ob-table td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-glass);
            font-size: 13px; color: var(--text-primary);
        }
        .ob-table tr:hover td { background: rgba(255,255,255,0.02); }

        /* MODAL STYLES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: var(--bg-panel); border-radius: 28px; width: 95%; max-width: 1000px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes modalPop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header {
            padding: 25px 32px; border-bottom: 1px solid var(--border-glass);
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-title { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .form-control {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass);
            border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 13px; outline: none; transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary-ob); box-shadow: 0 0 0 4px var(--primary-ob-glow); }

        .topic-section-title { font-size: 12px; font-weight: 800; color: var(--primary-ob); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .topic-card {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-glass); border-radius: 16px; padding: 16px;
            transition: all 0.2s;
        }
        .topic-card:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }
        .topic-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .topic-title { font-size: 12px; font-weight: 700; color: #fff; }
        .topic-day-select { 
            background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); 
            border-radius: 8px; color: var(--primary-ob); font-size: 11px; font-weight: 700; padding: 4px 8px; outline: none;
        }
        .topic-modules { font-size: 11px; color: var(--text-secondary); line-height: 1.5; opacity: 0.8; }

        .btn-ob {
            padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s;
            display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-family: 'Outfit', sans-serif;
        }
        .btn-ob-primary { background: linear-gradient(135deg, var(--primary-ob), #8b5cf6); color: #fff; box-shadow: 0 10px 20px -10px var(--primary-ob-glow); }
        .btn-ob-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -10px var(--primary-ob-glow); filter: brightness(1.1); }
        
        .btn-ob-icon { width: 34px; height: 34px; padding: 0; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: var(--text-muted); border-radius: 10px; }
        .btn-ob-icon:hover { background: var(--primary-ob); color: #fff; border-color: var(--primary-ob); }

        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-badge.success { background: rgba(16,185,129,0.1); color: #10b981; }
        .status-badge.danger { background: rgba(239,68,68,0.1); color: #ef4444; }

        /* Search input style */
        .search-container { position: relative; }
        .search-container input { padding-left: 42px; width: 280px; height: 42px; }
        .search-container svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="page-loader" id="pageLoader"></div>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand"><img src="logo.png" alt="MineHR Logo" class="brand-logo"/></div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search operations, companies..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span>
                        <span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div style="text-align: right; display: flex; flex-direction: column;">
                                <span id="userName" style="font-size: 14px; font-weight: 700; color: var(--text-primary);">Admin User</span>
                                <span id="userRole" style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Super Admin</span>
                            </div>
                            <div id="userAvatarContainer" style="width: 42px; height: 42px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; border: 2px solid var(--glass-border);">
                                AU
                            </div>
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin User</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="ob-page-hero">
                    <div class="ob-breadcrumb">ONBOARDING <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"/></svg> <span>TRAINING BATCH</span></div>
                    <h1 class="ob-page-title">Manage Training Batches</h1>
                </div>

                <div class="ob-card">
                    <div class="ob-card-header">
                        <div class="search-container">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="batchSearch" class="form-control" placeholder="Search batch name..."/>
                        </div>
                        <button class="btn-ob btn-ob-primary" onclick="openAddModal()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            ADD NEW BATCH
                        </button>
                    </div>
                    <div style="overflow-x:auto;">
                        <table class="ob-table">
                            <thead>
                                <tr>
                                    <th style="width:50px;">Sr No</th>
                                    <th>Batch Name</th>
                                    <th>Training Days</th>
                                    <th>Batch Type</th>
                                    <th>Participant</th>
                                    <th>Created Date</th>
                                    <th>Status</th>
                                    <th style="width:100px;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="batchTableBody">
                                <!-- JS loaded rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="batchModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Add New Training Batch</h2>
                <button class="modal-close" onclick="closeModal('batchModal')">&times;</button>
            </div>
            <div style="padding:32px;">
                <form id="batchForm" onsubmit="event.preventDefault(); saveBatch();">
                    <input type="hidden" id="batchId"/>
                    
                    <div class="topic-section-title" style="margin-bottom:20px; border-bottom:1px solid rgba(99,102,241,0.2); padding-bottom:10px;">1. Basic Information</div>
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Batch Name <span style="color:#ef4444;">*</span></label>
                            <input type="text" id="batchName" class="form-control" placeholder="e.g. Paid Clients Session" required/>
                        </div>
                        <div class="form-group">
                            <label>Batch Type</label>
                            <select id="batchType" class="form-control">
                                <option value="Monday To Friday">Monday To Friday</option>
                                <option value="Saturday">Saturday</option>
                                <option value="Any Day">Any Day</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Participant Name</label>
                            <select id="participantType" class="form-control">
                                <option value="HR">HR</option>
                                <option value="Owner">Owner</option>
                                <option value="Leader">Leader</option>
                                <option value="Employee">Employee</option>
                            </select>
                        </div>
                        <div class="form-group" style="grid-column: span 1;">
                            <label>Training Days <span style="color:#ef4444;">*</span></label>
                            <input type="number" id="trainingDays" class="form-control" value="1" min="1" max="30" required/>
                        </div>
                    </div>

                    <div class="topic-section-title" style="margin:30px 0 20px 0; border-bottom:1px solid rgba(99,102,241,0.2); padding-bottom:10px;">2. Topic Groups Configuration</div>
                    <div class="topic-grid" id="topicGrid">
                        <!-- JS loaded topics -->
                    </div>

                    <div style="margin-top:40px; display:flex; justify-content:flex-end; gap:12px; border-top:1px solid var(--border-glass); padding-top:25px;">
                        <button type="button" class="btn-ob" style="background:rgba(255,255,255,0.05); color:#fff;" onclick="closeModal('batchModal')">CANCEL</button>
                        <button type="submit" id="saveBatchBtn" class="btn-ob btn-ob-primary" style="padding:12px 60px;">SAVE BATCH</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/training-batch.js"></script>
    <script>
        // Check auth and set user info
         catch (err) { console.error('Auth error', err); }
        }
        document.addEventListener('DOMContentLoaded', checkAuth);
    </script>
</body>
</html>
