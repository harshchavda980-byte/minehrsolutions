<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity Review — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .review-container {
            max-width: 900px;
            margin: 0 auto;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
            transform: translateX(-5px);
        }

        .review-card {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px;
            box-shadow: var(--panel-shadow);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 30px;
        }

        .log-id-badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .review-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            margin-bottom: 40px;
        }

        .info-item label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .info-item .value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .payload-section {
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
        }

        .payload-header {
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        pre {
            padding: 30px;
            margin: 0;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #a5b4fc;
            overflow-x: auto;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 100px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            font-size: 12px;
            font-weight: 700;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole"
                                    style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar"
                                src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin"
                                style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="review-container">
                    <a href="activities.html" class="back-link">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back to Activity Logs
                    </a>

                    <div class="review-card">
                        <div class="review-header">
                            <div>
                                <h1 style="font-size: 2.2rem; font-weight: 800; margin-bottom: 5px;">Activity Review
                                </h1>
                                <p style="color: var(--text-muted);">Detailed audit information for this administrative
                                    action.</p>
                            </div>
                            <div class="log-id-badge" id="logId">LOG #000000</div>
                        </div>

                        <div class="review-grid">
                            <div class="info-item">
                                <label>Date & Time</label>
                                <div class="value" id="logDate">-</div>
                            </div>
                            <div class="info-item">
                                <label>Action Performed</label>
                                <div class="value" id="logAction" style="color: var(--primary);">Loading...</div>
                            </div>
                            <div class="info-item">
                                <label>Performed By</label>
                                <div class="value" id="logUser">-</div>
                            </div>
                            <div class="info-item">
                                <label>Target Module</label>
                                <div class="value" id="logModule">-</div>
                            </div>
                            <div class="info-item">
                                <label>IP Address</label>
                                <div class="value ip-text" id="logIp">-</div>
                            </div>
                            <div class="info-item">
                                <label>Target Company</label>
                                <div class="value" id="logCompany">-</div>
                            </div>
                        </div>

                        <div class="payload-section">
                            <div class="payload-header">
                                <span
                                    style="font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);">Raw
                                    Payload Data</span>
                                <div class="status-indicator">
                                    <div class="status-dot"></div>
                                    SECURE AUDIT RECORD
                                </div>
                            </div>
                            <pre id="logDetails">{}</pre>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) { window.location.href = 'activities.html'; return; }

            const authRes = await fetch("/api/auth/me");
            if (!authRes.ok) { window.location.href = "/login"; return; }
            const user = await authRes.json();
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userRole').innerText = user.role;
            document.getElementById('userAvatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=6366f1&color=fff`;

            try {
                const res = await fetch(`/api/activities/${id}`);
                const data = await res.json();
                if (data.success) {
                    const log = data.log;
                    document.getElementById('logId').innerText = `LOG #${log.id}`;
                    document.getElementById('logDate').innerText = new Date(log.created_at || log.createdAt).toLocaleString();
                    document.getElementById('logAction').innerText = log.action;
                    document.getElementById('logUser').innerText = log.User ? log.User.name : 'System';
                    document.getElementById('logModule').innerText = log.module;
                    document.getElementById('logIp').innerText = log.ip_address || 'Unknown';
                    document.getElementById('logCompany').innerText = log.Company ? log.Company.name : 'General / Global';
                    document.getElementById('logDetails').innerText = JSON.stringify(log.details, null, 4);
                } else {
                    alert('Log not found');
                    window.location.href = 'activities.html';
                }
            } catch (err) {
                console.error(err);
                alert('Error loading log details');
            }
        });
    </script>
</body>

</html>
