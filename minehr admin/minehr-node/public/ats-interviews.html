<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interview Management — MineHR ATS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }

        .filter-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        .status-scheduled { background: #fae8ff; color: #86198f; }
        .status-completed { background: #dcfce7; color: #166534; }
        .status-rescheduled { background: #fef9c3; color: #854d0e; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }

        @media (max-width: 768px) {
            .filter-row { flex-direction: column; align-items: stretch; }
            .page-title { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .modal-content { width: 95% !important; padding: 15px !important; }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search interviews..." oninput="document.getElementById('searchInput').value = this.value; loadInterviews(1)" />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Interview Management</h1>
                        <p>Schedule and track interviews for shortlisted candidates.</p>
                    </div>
                    <button class="btn btn-primary" onclick="openInterviewModal()">+ Schedule Interview</button>
                </div>

                <div class="filter-row">
                    <div class="form-group">
                        <label>Search Candidate/Role</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search..." oninput="loadInterviews(1)">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusFilter" class="form-control" onchange="loadInterviews(1)">
                            <option value="">All Statuses</option>
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Rescheduled">Rescheduled</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" onclick="resetFilters()" style="height: 45px;">Reset</button>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>INT ID</th>
                                    <th>Candidate</th>
                                    <th>Job Role</th>
                                    <th>Type</th>
                                    <th>Date & Time</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="interviewTableBody"></tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination" style="margin-top: 20px; justify-content: flex-end;"></div>
                </div>

                <!-- Schedule Interview Modal -->
                <div id="interviewModal" class="modal">
                    <div class="modal-content glass" style="max-width: 550px;">
                        <div class="modal-header">
                            <h2 id="modalTitle">Schedule Interview</h2>
                            <button class="close-modal" onclick="closeModal('interviewModal')">&times;</button>
                        </div>
                        <form id="interviewForm" onsubmit="handleInterviewSubmit(event)">
                            <div class="modal-body">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                    <div class="form-group" style="grid-column: span 2;">
                                        <label>Select Candidate (Application) *</label>
                                        <select id="appSelect" class="form-control" required>
                                            <option value="">Choose Application</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Interview Type *</label>
                                        <select id="intType" class="form-control" required>
                                            <option value="Online">Online</option>
                                            <option value="Phone">Phone</option>
                                            <option value="In-person">In-person</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Date & Time *</label>
                                        <input type="datetime-local" id="intDateTime" class="form-control" required>
                                    </div>
                                    <div class="form-group" style="grid-column: span 2;">
                                        <label>Interviewer ID's (Comma separated)</label>
                                        <input type="text" id="intViewers" class="form-control" placeholder="e.g. 1, 3, 5">
                                    </div>
                                    <div class="form-group" style="grid-column: span 2;">
                                        <label>Notes</label>
                                        <textarea id="intNotes" class="form-control" rows="3" placeholder="Additional instructions or meeting link..."></textarea>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer" style="margin-top: 20px;">
                                <button type="submit" class="btn btn-primary" id="saveBtn">Schedule Interview</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Update Status Modal -->
                <div id="statusModal" class="modal">
                    <div class="modal-content glass" style="max-width: 400px;">
                        <div class="modal-header">
                            <h2>Update Interview Status</h2>
                            <button class="close-modal" onclick="closeModal('statusModal')">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Status</label>
                                <select id="updateStatusSelect" class="form-control">
                                    <option value="Scheduled">Scheduled</option>
                                    <option value="Completed">Completed</option>
                                    <option value="Rescheduled">Rescheduled</option>
                                    <option value="Cancelled">Cancelled</option>
                                </select>
                            </div>
                            <button class="btn btn-primary" style="margin-top: 15px; width: 100%;" onclick="confirmStatusUpdate()">Update Status</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/ats-interviews.js"></script>
</body>

</html>
