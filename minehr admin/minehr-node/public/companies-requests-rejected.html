<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejected Companies — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .filters-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 35px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: var(--panel-shadow);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-left: 5px;
        }

        .form-control {
            background: var(--glass-bg) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 14px !important;
            padding: 14px 18px !important;
            color: var(--text-primary) !important;
            font-family: inherit;
            font-size: 14px;
            transition: var(--transition);
            outline: none;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--primary) !important;
            background: var(--bg-sidebar) !important;
            box-shadow: 0 0 0 4px var(--primary-glow) !important;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
        }

        body.light input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0);
        }

        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 18px 0 4px;
        }

        .pagination button {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            background: rgba(255, 255, 255, 0.1) !important;
            cursor: pointer;
            transition: all 0.2s;
            color: #f8fafc !important;
            font-weight: 600;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--primary) !important;
            color: white !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 12px var(--primary-glow) !important;
        }

        .pagination button:disabled {
            opacity: 0.35 !important;
            cursor: not-allowed;
        }

        .pagination .active {
            background: var(--primary) !important;
            color: white !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 12px var(--primary-glow) !important;
        }

        /* Light theme: enhanced visibility */
        .light .pagination button {
            border-color: rgba(0, 0, 0, 0.22) !important;
            background: rgba(0, 0, 0, 0.06) !important;
            color: #1e293b !important;
        }
        .light .pagination button:hover:not(:disabled) {
            background: var(--primary) !important;
            color: #fff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 12px var(--primary-glow) !important;
        }
        .light .pagination .active {
            background: var(--primary) !important;
            color: #fff !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 12px var(--primary-glow) !important;
        }

        /* Compact/Smaller Sizing Adjustments for this page */
        .content.active-page {
            padding: 15px 25px !important;
        }
        
        .page-header-actions {
            margin-bottom: 15px !important;
        }
        
        .page-title h1 {
            font-size: 1.8rem !important;
        }
        
        .page-title p {
            font-size: 12px !important;
        }

        .filters-panel {
            padding: 12px 18px !important;
            margin-bottom: 20px !important;
            border-radius: 16px !important;
            gap: 15px !important;
        }

        .form-group {
            gap: 6px !important;
        }

        .form-group label {
            font-size: 10px !important;
            letter-spacing: 1px !important;
            margin-left: 2px !important;
        }

        .form-control {
            padding: 8px 12px !important;
            font-size: 13px !important;
            border-radius: 10px !important;
            height: 38px !important;
        }
        
        .refresh-btn {
            height: 38px !important;
            min-width: 100px !important;
            border-radius: 10px !important;
            font-size: 13px !important;
            padding: 0 12px !important;
        }

        .premium-table-wrapper {
            padding: 15px 20px !important;
            border-radius: 16px !important;
        }

        .premium-table {
            border-spacing: 0 6px !important;
        }

        .premium-table th {
            padding: 10px 14px !important;
            font-size: 10px !important;
            letter-spacing: 1px !important;
        }

        .premium-table tbody tr td {
            padding: 10px 14px !important;
            font-size: 12.5px !important;
        }
        
        .premium-table tbody tr td div {
            font-size: 12.5px !important;
        }
        .premium-table tbody tr td div[style*="font-size: 15px"] {
            font-size: 13.5px !important;
        }
        .premium-table tbody tr td div[style*="font-size: 11px"] {
            font-size: 10px !important;
        }
        .premium-table tbody tr td div[style*="font-size: 12px"] {
            font-size: 10.5px !important;
        }
        
        .premium-table tbody tr td:first-child {
            border-radius: 10px 0 0 10px !important;
        }

        .premium-table tbody tr td:last-child {
            border-radius: 0 10px 10px 0 !important;
        }
        
        .badge {
            padding: 4px 8px !important;
            font-size: 10px !important;
        }
        
        .premium-table .btn {
            padding: 0 !important;
            width: 28px !important;
            height: 28px !important;
            border-radius: 8px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            flex-shrink: 0 !important;
        }
        
        .pagination {
            margin-top: 20px !important;
            gap: 6px !important;
        }

        .pagination button {
            width: auto !important;
            height: 32px !important;
            padding: 0 12px !important;
            border-radius: 8px !important;
            font-size: 12px !important;
        }

        /* ── Mobile fixes (≤576px) ─────────────────────────────────────── */
        @media screen and (max-width: 576px) {
            .content.active-page {
                padding: 10px 12px !important;
            }

            /* Keep title + button in a row, tighten spacing */
            .page-header-actions {
                flex-wrap: nowrap !important;
                align-items: flex-start !important;
                gap: 10px !important;
                margin-bottom: 12px !important;
            }

            /* Title takes all remaining space */
            .page-title {
                flex: 1 1 auto !important;
                min-width: 0 !important;
            }

            .page-title h1 {
                font-size: 1.3rem !important;
                line-height: 1.2 !important;
                margin-bottom: 4px !important;
            }

            .page-title p {
                font-size: 11px !important;
                line-height: 1.4 !important;
            }

            /* Refresh button — compact, right-aligned, auto width */
            .header-actions {
                flex-shrink: 0 !important;
                align-self: flex-start !important;
            }

            .refresh-btn {
                height: 34px !important;
                min-width: auto !important;
                width: auto !important;
                padding: 0 12px !important;
                font-size: 12px !important;
                border-radius: 8px !important;
                white-space: nowrap !important;
            }

            /* Stack filters vertically */
            .filters-panel {
                flex-direction: column !important;
                padding: 10px 12px !important;
                gap: 10px !important;
            }

            .form-group {
                width: 100% !important;
                min-width: unset !important;
            }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <a href="dashboard.html"><img src="logo.png" alt="MineHR Logo" class="brand-logo" /></a>
            </div>
            <nav id="sidebarNav">
                <!-- Sidebar content injected by sidebar.js -->
            </nav>
        </aside>
        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="topbarSearch" oninput="document.getElementById('searchInput').value = this.value; filterTable()" placeholder="Search requests..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span>
                        <span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div style="text-align: right; display: flex; flex-direction: column;">
                                <span id="userName" style="font-size: 14px; font-weight: 600;">Admin</span>
                                <span id="userRole" style="font-size: 11px; color: var(--text-muted);">Super Admin</span>
                            </div>
                            <div id="userAvatarContainer" style="width: 42px; height: 42px; border-radius: 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 16px; border: 2px solid var(--glass-border);">AU</div>
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content active-page">
                <div class="page-header-actions" style="margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center;">
                    <div class="page-title">
                        <h1>Rejected Companies</h1>
                        <p>List of company registration requests that were rejected.</p>
                    </div>
                    <div class="header-actions" style="display: flex; gap: 10px;">
                        <button class="btn btn-primary refresh-btn" id="refreshBtn" onclick="refreshPageData(this)" style="height: 45px; min-width: 120px; border-radius: 12px; display: flex; align-items: center; gap: 8px; font-weight: 700;">
                            <svg class="refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                            Refresh
                        </button>
                    </div>
                </div>

                <div class="filters-panel">
                    <div class="form-group" style="flex: 2;">
                        <label>Search by Company/Email</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by name, email..."
                            oninput="filterTable()">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Rejection Date</label>
                        <input type="date" id="dateFilter" class="form-control" onchange="filterTable()">
                    </div>
                </div>

                <div class="premium-table-wrapper">
                    <div class="premium-table-container">
                        <table class="premium-table">
                            <thead>
                                <tr>
                                    <th>Req ID</th>
                                    <th>Company</th>
                                    <th>Admin / Contact</th>
                                    <th>Number</th>
                                    <th>Slots</th>
                                    <th>Plan &amp; Expiry</th>
                                    <th>Status</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="companiesTableBody">
                                <!-- Data will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="pagination" id="paginationControls">
                    <!-- Pagination buttons here -->
                </div>
            </section>
        </main>
    </div>
    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/companies-requests.js"></script>
    <script>
        function refreshPageData(btn) {
            const icon = btn ? btn.querySelector('.refresh-icon') : null;
            if (icon) {
                icon.style.transition = 'transform 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
                icon.style.transform = 'rotate(360deg)';
                setTimeout(() => { icon.style.transition = 'none'; icon.style.transform = 'rotate(0deg)'; }, 750);
            }
            if (typeof loadPageData === 'function') { loadPageData(1); } else { location.reload(); }
        }
    </script>
</body>

</html>
