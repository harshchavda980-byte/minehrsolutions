<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Execution History — MineHR Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .status-success { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-failed { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .status-partial { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand"><img src="logo.png" alt="MineHR Logo" class="brand-logo" /></div>
            <nav id="sidebarNav"></nav>
        </aside>
        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search history..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title">
                    <h1>Execution History</h1>
                    <p>Audit trail of all system-level cron jobs and automated tasks.</p>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Task Name</th>
                                    <th>Started At</th>
                                    <th>Duration</th>
                                    <th>Processed</th>
                                    <th>Status</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody">
                                <tr><td colspan="6" style="text-align:center; padding: 40px;">Loading history...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="paginationControls"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script>
        let currentPage = 1;
        document.addEventListener("DOMContentLoaded", () => { loadHistory(1); });

        async function loadHistory(page) {
            currentPage = page;
            try {
                const res = await fetch(`/api/logs/execution?page=${page}`);
                const data = await res.json();
                if (data.success) {
                    renderHistory(data.history);
                    renderPagination(data.pages, data.currentPage);
                }
            } catch (err) { console.error(err); }
        }

        function renderHistory(history) {
            const tbody = document.getElementById('historyTableBody');
            if (!history.length) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-muted);">No history found.</td></tr>`;
                return;
            }
            tbody.innerHTML = history.map(h => {
                const start = new Date(h.started_at);
                const end = h.finished_at ? new Date(h.finished_at) : null;
                const duration = end ? ((end - start) / 1000).toFixed(2) + 's' : 'Running...';

                return `
                    <tr>
                        <td><strong>${h.cron_name}</strong></td>
                        <td><small>${start.toLocaleString()}</small></td>
                        <td>${duration}</td>
                        <td>${h.items_processed} items</td>
                        <td><span class="badge status-${h.status.toLowerCase()}">${h.status}</span></td>
                        <td><div style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${h.details || '-'}</div></td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination(total, current) {
            const controls = document.getElementById('paginationControls');
            if (total <= 1) { controls.innerHTML = ''; return; }
            let html = `<button class="btn btn-outline btn-sm" onclick="loadHistory(${current - 1})" ${current <= 1 ? 'disabled' : ''}>Prev</button>`;
            for (let i = 1; i <= total; i++) {
                html += `<button class="btn btn-sm ${current === i ? 'btn-primary' : 'btn-outline'}" onclick="loadHistory(${i})">${i}</button>`;
            }
            html += `<button class="btn btn-outline btn-sm" onclick="loadHistory(${current + 1})" ${current >= total ? 'disabled' : ''}>Next</button>`;
            controls.innerHTML = html;
        }
    </script>
</body>
</html>
