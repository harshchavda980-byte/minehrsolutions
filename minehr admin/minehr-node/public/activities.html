<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <title>Activity Logs — MineHR Master</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .filter-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr 1fr auto;
            gap: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 35px;
            align-items: flex-end;
            box-shadow: var(--card-shadow);
            position: relative;
            z-index: 100;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
        }

        .premium-table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 10px;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; padding: 0 15px; }
        th { padding: 15px 20px; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; text-align: left; }
        td { padding: 18px 20px; background: rgba(255, 255, 255, 0.02); border-top: 1px solid var(--glass-border); border-bottom: 1px solid var(--glass-border); color: var(--text-primary); font-size: 14px; transition: all 0.2s; }
        td:first-child { border-left: 1px solid var(--glass-border); border-radius: 16px 0 0 16px; }
        td:last-child { border-right: 1px solid var(--glass-border); border-radius: 0 16px 16px 0; }
        tr:hover td { background: rgba(99, 102, 241, 0.05); border-color: rgba(99, 102, 241, 0.25); cursor: pointer; }

        .log-badge {
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .module-auth { background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.2); }
        .module-companies { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .module-plans { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .module-system { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }

        .ip-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted); opacity: 0.7; }

        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            border-top: 1px solid var(--glass-border);
        }

        .pagination-controls { display: flex; gap: 8px; }

        @media (max-width: 1024px) {
            .filter-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search operations, companies..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="margin-bottom: 40px;">
                    <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 8px;">Activity Logs</h1>
                    <p style="color: var(--text-muted); font-size: 1.1rem;">Comprehensive audit trail of all administrative actions.</p>
                </div>

                <div class="filter-grid">
                    <div class="form-group">
                        <label>Search Action/User</label>
                        <input type="text" id="logSearch" class="form-control" placeholder="Type to filter..." oninput="triggerFilter()" style="border-radius: 14px;">
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="text" id="startDate" class="form-control" placeholder="YYYY-MM-DD" readonly style="border-radius: 14px;">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="text" id="endDate" class="form-control" placeholder="YYYY-MM-DD" readonly style="border-radius: 14px;">
                    </div>
                    <div class="form-group">
                        <label>Module</label>
                        <select id="moduleFilter" class="form-control" style="border-radius: 14px;">
                            <option value="">All Modules</option>
                            <option value="Auth">Auth</option>
                            <option value="Companies">Companies</option>
                            <option value="Plans">Plans</option>
                            <option value="Locations">Locations</option>
                            <option value="Settings">Settings</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" id="resetFilters" style="height: 48px; padding: 0 25px; border-radius: 14px;">Reset</button>
                </div>

                <div class="premium-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Date & Time</th>
                                <th>Performed By</th>
                                <th>Company</th>
                                <th>Module</th>
                                <th>Action</th>
                                <th style="text-align: right;">IP Address</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody"></tbody>
                    </table>
                    <div id="paginationContainer" class="pagination-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/minehr-datepicker.js"></script>
    <script src="js/activities.js"></script>
</body>
</html>
