<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Management — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .city-filter-row {
            display: grid;
            grid-template-columns: 1fr 200px 120px;
            gap: 20px;
            margin-bottom: 35px;
            background: var(--glass-bg);
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
        }

        .city-filter-row .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: 12px !important;
            padding: 12px 18px !important;
            color: white !important;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1) !important;
        }

        /* Ensure dropdown options are readable in dark mode */
        .form-control option {
            background-color: #1a1d24 !important;
            color: white !important;
            padding: 10px;
        }

        .form-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(255, 255, 255, 0.02) !important;
        }

        /* Table Styling */
        .premium-table-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 10px;
            backdrop-filter: blur(20px);
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            padding: 0 15px;
        }

        th {
            padding: 15px 20px;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
            border: none;
        }

        td {
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 14px;
        }

        td:first-child { border-left: 1px solid var(--glass-border); border-radius: 16px 0 0 16px; }
        td:last-child { border-right: 1px solid var(--glass-border); border-radius: 0 16px 16px 0; }

        tr:hover td {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-badge.active { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .status-badge.active::before { content: ''; width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }

        .status-badge.inactive { background: rgba(239, 68, 68, 0.1); color: #f87171; }
        .status-badge.inactive::before { content: ''; width: 6px; height: 6px; background: #f87171; border-radius: 50%; }

        /* Action Buttons */
        .action-group { display: flex; gap: 10px; }
        .btn-action {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }
        .btn-action.danger:hover { background: var(--danger); }

        @media (max-width: 768px) {
            .city-filter-row { grid-template-columns: 1fr; }
            .page-title { flex-direction: column; align-items: flex-start !important; gap: 15px; }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="globalSearch" placeholder="Search cities, states..." oninput="document.getElementById('searchInput').value = this.value; loadCities(1)">
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
                    <div>
                        <h1 style="font-size: 2.2rem; font-weight: 700; margin-bottom: 8px;">City Management</h1>
                        <p style="color: var(--text-muted); font-size: 1.1rem;">Manage cities, states, and countries accessible in the system.</p>
                    </div>
                    <button class="btn btn-primary" onclick="openCityModal()" style="padding: 14px 28px; border-radius: 14px; font-weight: 700;">+ Add City</button>
                </div>

                <div class="city-filter-row">
                    <div class="form-group">
                        <label>Search Cities</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="City, State, or Country..." oninput="loadCities(1)">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusFilter" class="form-control" onchange="loadCities(1)">
                            <option value="">All Statuses</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" onclick="resetFilters()" style="height: 48px; border-radius: 12px;">Reset</button>
                </div>

                <div class="premium-table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="cursor: pointer;" onclick="handleSort('id')">ID <span id="sort_id"></span></th>
                                <th style="cursor: pointer;" onclick="handleSort('name')">City Name <span id="sort_name"></span></th>
                                <th style="cursor: pointer;" onclick="handleSort('state_name')">State <span id="sort_state_name"></span></th>
                                <th style="cursor: pointer;" onclick="handleSort('country_name')">Country <span id="sort_country_name"></span></th>
                                <th style="cursor: pointer;" onclick="handleSort('status')">Status <span id="sort_status"></span></th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="cityTableBody"></tbody>
                    </table>
                    <div id="paginationControls" class="pagination" style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--glass-border);"></div>
                </div>

                <!-- City Modal -->
                <div id="cityModal" class="modal">
                    <div class="modal-content glass" style="max-width: 500px; padding: 40px; border-radius: 32px; border: 1px solid var(--glass-border); box-shadow: var(--card-shadow);">
                        <div class="modal-header" style="margin-bottom: 30px;">
                            <h2 id="modalTitle" style="font-size: 1.8rem; font-weight: 700;">Add New City</h2>
                            <button class="close-modal" onclick="closeModal('cityModal')" style="background: rgba(255,255,255,0.05); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border);">&times;</button>
                        </div>
                        <form id="cityForm" onsubmit="handleCitySubmit(event)">
                            <div class="modal-body" style="display: grid; gap: 25px;">
                                <div class="form-group">
                                    <label>Country *</label>
                                    <select id="countrySelect" class="form-control" required>
                                        <option value="">Select Country</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>State *</label>
                                    <select id="stateSelect" class="form-control" required disabled>
                                        <option value="">Select State</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>City Name *</label>
                                    <input type="text" id="cityName" class="form-control" required placeholder="Enter city name">
                                </div>
                                <div class="form-group">
                                    <label>Status</label>
                                    <select id="cityStatus" class="form-control">
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer" style="margin-top: 40px;">
                                <button type="submit" class="btn btn-primary" id="saveBtn" style="width: 100%; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 1rem; box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);">Save City Information</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/location-helper.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/city.js"></script>
</body>

</html>
