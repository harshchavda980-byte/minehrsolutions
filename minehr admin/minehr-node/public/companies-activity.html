<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COMPANIES ACTIVITY — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
</head>

<body>
    <div class="admin-layout">
                        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav">
                <!-- Sidebar content injected by sidebar.js -->
            </nav>
        </aside>
        <main class="main main-content">
                                    <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo">
                        <img src="logo.png" alt="MineHR Logo" />
                    </a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" placeholder="Search operations, companies..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span>
                        <span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div style="text-align: right; display: flex; flex-direction: column;">
                                <span id="userName" style="font-size: 14px; font-weight: 600;">Admin</span>
                                <span id="userRole" style="font-size: 11px; color: var(--text-muted);">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin"
                                style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content active-page">
                <div class="page-title">
                    <h1>COMPANIES ACTIVITY</h1>
                    <p>Real-time audit trails of all company-related operations and system events.</p>
                </div>
                
                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Timestamp</th>
                                    <th>Company</th>
                                    <th>Module</th>
                                    <th>Action</th>
                                    <th>Performed By</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody id="activityLogsBody">
                                <!-- Logs will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination" style="margin-top: 20px; justify-content: flex-end;"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/admin.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        async function loadActivityLogs(page = 1) {
            try {
                const res = await fetch(`/api/activities?page=${page}&limit=15`);
                const data = await res.json();
                
                const tbody = document.getElementById('activityLogsBody');
                if (!data.logs.length) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px; color: var(--text-muted);">No activity logs found.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.logs.map(log => `
                    <tr>
                        <td style="font-size: 12px; color: var(--text-muted);">${formatDateTime(log.created_at)}</td>
                        <td><strong style="color: var(--text-primary);">${log.Company ? log.Company.name : 'System'}</strong></td>
                        <td><span class="badge" style="background: rgba(255,255,255,0.05);">${log.module}</span></td>
                        <td><span style="font-weight: 600; color: var(--primary);">${log.action}</span></td>
                        <td>${log.User ? log.User.name : 'System'}</td>
                        <td style="font-size: 11px; color: var(--text-muted); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title='${JSON.stringify(log.details)}'>
                            ${JSON.stringify(log.details)}
                        </td>
                    </tr>
                `).join('');

                renderPagination(data.totalPages, data.page);
            } catch (err) {
                console.error(err);
            }
        }

        function renderPagination(total, current) {
            const controls = document.getElementById('paginationControls');
            if (total <= 1) { controls.innerHTML = ''; return; }
            let html = `
                <button class="btn btn-outline btn-sm" onclick="loadActivityLogs(${current - 1})" ${current <= 1 ? 'disabled' : ''}>Prev</button>
                <button class="btn btn-sm btn-primary" onclick="loadActivityLogs(${current})">${current}</button>
                <button class="btn btn-outline btn-sm" onclick="loadActivityLogs(${current + 1})" ${current >= total ? 'disabled' : ''}>Next</button>
            `;
            controls.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => loadActivityLogs(1));
    </script>
    <script src="js/sidebar.js"></script>
</body>

</html>
