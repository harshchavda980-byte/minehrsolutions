<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Industry Type Management — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }

        .filter-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        @media (max-width: 768px) {
            .filter-row { flex-direction: column; align-items: stretch; }
            .page-title { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .modal-content { width: 95% !important; padding: 15px !important; }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search operations, companies..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px;">
                    <div>
                        <h1>Industry Types</h1>
                        <p style="color: var(--text-muted);">Define and manage industry categories for company classification.</p>
                    </div>
                    <div style="display: flex; gap: 15px; align-items: flex-end;">
                        <div class="filter-row" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; background: var(--glass-bg); padding: 15px 25px; border-radius: 16px; border: 1px solid var(--glass-border);">
                            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 180px;">
                                <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Search Name</label>
                                <input type="text" id="searchInput" class="premium-filter" placeholder="Search industries..." oninput="loadIndustries(1)" style="width: 100%;">
                            </div>
                            <div class="form-group" style="margin-bottom: 0; flex: 1; min-width: 140px;">
                                <label style="display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Status</label>
                                <select id="statusFilter" class="premium-filter" onchange="loadIndustries(1)" style="width: 100%;">
                                    <option value="">All Statuses</option>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <button class="btn btn-outline" onclick="resetFilters()" style="height: 45px; padding: 0 20px;">Reset</button>
                        </div>
                        <button class="btn btn-primary" onclick="openIndustryModal()" style="height: 45px; padding: 0 25px;">+ Add Industry</button>
                    </div>
                </div>

                <div class="panel premium-table-wrapper">
                    <div class="premium-table-container">
                        <table class="premium-table">
                            <thead>
                                <tr>
                                    <th style="cursor: pointer;" onclick="handleSort('id')">ID <span id="sort_id"></span></th>
                                    <th style="cursor: pointer;" onclick="handleSort('sequence')">Sequence <span id="sort_sequence"></span></th>
                                    <th style="cursor: pointer;" onclick="handleSort('name')">Industry Name <span id="sort_name"></span></th>
                                    <th>Description</th>
                                    <th style="cursor: pointer;" onclick="handleSort('status')">Status <span id="sort_status"></span></th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="industryTableBody"></tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination" style="margin-top: 20px; justify-content: flex-end;"></div>
                </div>

                <!-- Industry Modal -->
                <div id="industryModal" class="modal">
                    <div class="modal-content glass" style="max-width: 500px;">
                        <div class="modal-header">
                            <h2 id="modalTitle">Add Industry Type</h2>
                            <button class="close-modal" onclick="closeModal('industryModal')">&times;</button>
                        </div>
                        <form id="industryForm" onsubmit="handleIndustrySubmit(event)">
                            <div class="modal-body">
                                <div class="form-group">
                                    <label>Industry Name *</label>
                                    <input type="text" id="industryName" class="form-control" required placeholder="e.g. Information Technology">
                                </div>
                                <div class="form-group">
                                    <label>Description (Optional)</label>
                                    <textarea id="industryDesc" class="form-control" rows="3" placeholder="Brief description..."></textarea>
                                </div>
                                <div class="form-group">
                                    <label>Status</label>
                                    <select id="industryStatus" class="form-control">
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                                <div class="form-group" style="margin-top: 15px;">
                                    <label>Display Sequence (Order)</label>
                                    <input type="number" id="industrySeq" class="form-control" value="0" placeholder="0">
                                </div>
                            </div>
                            <div class="modal-footer" style="margin-top: 20px;">
                                <button type="submit" class="btn btn-primary" id="saveBtn">Save Industry Type</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/industry-type.js"></script>
</body>

</html>
