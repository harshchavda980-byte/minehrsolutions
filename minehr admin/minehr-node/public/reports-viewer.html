<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Viewer — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
        }
        
        /* Stats Pill Grid */
        .report-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }
        @media (max-width: 768px) {
            .report-stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .report-stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }
        .report-stat-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .light .report-stat-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }
        .stat-card-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card-value {
            font-size: 26px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        
        /* Premium Filter Bar */
        .filter-bar {
            display: flex;
            gap: 20px;
            background: var(--bg-panel);
            padding: 22px 26px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        
        /* Premium Table Grid */
        .data-table-container {
            background: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: var(--panel-shadow);
        }
        
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        table.data-table th {
            background: rgba(0, 0, 0, 0.15);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .light table.data-table th {
            background: rgba(0, 0, 0, 0.02);
        }
        
        table.data-table td {
            padding: 16px 24px;
            font-size: 13.5px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        
        table.data-table tbody tr {
            transition: all 0.2s;
        }
        
        table.data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.015);
        }
        .light table.data-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.01);
        }
        
        table.data-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending { background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-approved { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-rejected { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

        /* Horizontal Submodules Navigation Bar */
        .report-submodules-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 5px 25px 5px;
            margin-bottom: 10px;
            scroll-behavior: smooth;
        }
        
        /* Hide scrollbars but keep horizontal scroll behavior */
        .report-submodules-container::-webkit-scrollbar {
            height: 4px;
        }
        .report-submodules-container::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
        }
        
        .submodule-card {
            flex: 0 0 280px; /* Fixed width for standard card design */
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            position: relative;
        }
        
        .submodule-card:hover {
            transform: translateY(-2px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        
        .light .submodule-card:hover {
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.05);
        }
        
        .submodule-card.active {
            background: rgba(99, 102, 241, 0.08);
            border: 2.5px solid var(--primary);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.15);
        }
        .light .submodule-card.active {
            background: rgba(99, 102, 241, 0.05);
            border-color: var(--primary);
        }
        
        .submodule-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        
        .submodule-card:hover .submodule-icon-box {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        
        .submodule-card.active .submodule-icon-box {
            background: var(--primary);
            color: #fff;
        }
        
        .submodule-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            text-align: left;
        }
        
        .submodule-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .submodule-desc {
            font-size: 11.5px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

            </header>

                    </div>

                    </div>
                </div>

                <!-- PREMIUM QUICK STATS GRID -->

                    <div class="report-stat-card">
                        <span class="stat-card-label">Total Records</span>
                        <strong id="statTotalRecords" class="stat-card-value">—</strong>
                    </div>
                    <div class="report-stat-card">
                        <span class="stat-card-label">Reporting Period</span>
                        <strong class="stat-card-value">LAST 30 DAYS</strong>
                    </div>
                    <div class="report-stat-card">
                        <span class="stat-card-label">Security & Integrity</span>

                            VERIFIED <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#10b981;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </strong>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label style="display:block; font-size: 11px; font-weight:800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">DATE RANGE</label>
                        <div style="display:flex; gap:10px;">
                            <input type="date" class="form-control" id="dateFrom" style="height: 42px;">
                            <input type="date" class="form-control" id="dateTo" style="height: 42px;">
                        </div>
                    </div>
                    <div style="width: 220px;">
                        <label style="display:block; font-size: 11px; font-weight:800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">STATUS</label>
                        <select class="form-control" id="statusFilter" style="height: 42px;">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" style="padding: 11px 30px; border-radius: 12px; height: 42px;" onclick="loadReportData()">Generate</button>
                </div>

                <div class="data-table-container">
                    <table class="data-table" id="reportTable">
                        <thead id="tableHead">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="tableBody">
                            <!-- Injected by JS -->
                            <tr><td colspan="100%" style="text-align:center; padding:100px; color:var(--text-muted);">Generating report data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

             // Dynamic Category titles matching horizontal layout concept
             const categoryLabels = {
                 sales_crm: { title: "Sales & CRM Reports", desc: "Generate and export Sales & CRM analytical insights." },
                 company_insights: { title: "Company Insights Reports", desc: "Review organizational statistics and registration analytics." },
                 operations_support: { title: "Operations & Support", desc: "Audit active system operations and technical support tickets." },
                 specialized_analytics: { title: "Specialized Analytics", desc: "Track smart integrations and custom branding metrics." },
                 implementation: { title: "Implementation & Onboarding", desc: "Review training performance, slots, and setup checklists." },
                 financial_tech: { title: "Financial & Hardware Logs", desc: "Review payment transactions and biometric server logs." }
             };
 
             const catInfo = categoryLabels[config.category] || { title: "Analytical Reports", desc: "Audit active system records." };
             document.getElementById('reportTitle').innerText = catInfo.title;
             document.getElementById('reportDesc').innerText = catInfo.desc;
             
             renderTableHead(config.columns);
             loadReportData();
 
             // Render horizontal submodules row
             const submodulesRow = document.getElementById('reportSubmodulesRow');
             if (submodulesRow) {
                 const siblingReports = Object.entries(reportConfig).filter(([key, cfg]) => cfg.category === config.category);
                 
                 submodulesRow.innerHTML = siblingReports.map(([key, cfg]) => {
                     const isActive = key === reportType;
                     return `
                         <a class="submodule-card ${isActive ? 'active' : ''}" href="reports-viewer.html?type=${key}">
                             <div class="submodule-icon-box">${cfg.icon || '📊'}</div>
                             <div class="submodule-details">
                                 <span class="submodule-title">${cfg.shortLabel || cfg.title}</span>
                                 <span class="submodule-desc">${cfg.shortDesc || cfg.desc}</span>
                             </div>
                         </a>
                     `;
                 }).join('');
             }
 
             // Real-time local search on report rows
             const searchInput = document.getElementById('reportSearch');
             if (searchInput) {
                 searchInput.addEventListener('input', (e) => {
                     const query = e.target.value.toLowerCase().trim();
                     const rows = document.querySelectorAll('#tableBody tr');
                     
                     let visibleCount = 0;
                     rows.forEach(row => {
                         const text = row.innerText.toLowerCase();
                         if (text.includes(query)) {
                             row.style.display = '';
                             visibleCount++;
                         } else {
                             row.style.display = 'none';
                         }
                     });
 
                     // Update dynamic records counter
                     const totalRecordsEl = document.getElementById('statTotalRecords');
                     if (totalRecordsEl) {
                         totalRecordsEl.innerText = visibleCount;
                     }
                 });
             }

        });

        function renderTableHead(columns) {
            const head = document.getElementById('tableHead');
            head.innerHTML = `<tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr>`;
        }

        async function loadReportData() {
            const config = reportConfig[reportType] || reportConfig.pending_companies;
            const tbody = document.getElementById('tableBody');
            
            try {
                let rows = [];
                try {
                    const res = await fetch(config.endpoint);
                    if (res.ok) {
                        const data = await res.json();
                        rows = data.data || data.companies || data.history || data.leads || data.tickets || data.feedback || data.batches || data.meetings || data.devices || data.plans || [];
                    }
                } catch (e) {
                    console.log("Error loading real data for:", reportType, e);
                }

                if (!rows || rows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="100%" style="text-align:center; padding:60px; color:var(--text-muted); font-weight: 500;">No active records found in this database.</td></tr>`;
                    document.getElementById('statTotalRecords').innerText = "0";
                    return;
                }

                tbody.innerHTML = rows.map(row => renderRow(row, reportType)).join('');
                document.getElementById('statTotalRecords').innerText = rows.length;
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="100%" style="text-align:center; padding:60px; color:#ef4444;">Failed to load report data: ${err.message}</td></tr>`;
            }
        }
