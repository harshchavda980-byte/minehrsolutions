<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Requests — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .demo-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }

        .demo-filter-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        .status-new {
            background: #e0f2fe;
            color: #0369a1;
        }

        .status-scheduled {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        .scheduling-info {
            background: rgba(99, 102, 241, 0.05);
            border: 1px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .demo-filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .demo-filter-row .form-group {
                width: 100%;
            }

            .page-title {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 10px;
            }

            .modal-content {
                width: 95% !important;
                padding: 15px !important;
            }

            .preview-grid,
            .form-grid {
                grid-template-columns: 1fr !important;
            }
        }

        @media (min-width: 2000px) {
            .admin-layout {
                max-width: 2400px;
                margin: 0 auto;
            }

            .premium-table-container {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="topbarSearch" oninput="document.getElementById('searchInput').value = this.value; loadDemoRequests(1)" placeholder="Search requests..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Demo Requests</h1>
                        <p>Manage scheduling and follow-ups for product demos.</p>
                    </div>
                    <button class="btn btn-primary" onclick="openCreateModal()">+ Create Request</button>
                </div>

                <div class="demo-filter-row">
                    <div class="form-group">
                        <label>Search Requests</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Name, Company, Email..."
                            oninput="loadDemoRequests(1)">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusFilter" class="form-control" onchange="loadDemoRequests(1)">
                            <option value="">All Statuses</option>
                            <option value="New">New</option>
                            <option value="Scheduled">Scheduled</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Source</label>
                        <select id="sourceFilter" class="form-control" onchange="loadDemoRequests(1)">
                            <option value="">All Sources</option>
                            <option value="Website">Website</option>
                            <option value="Email">Email</option>
                            <option value="Campaign">Campaign</option>
                            <option value="Direct">Direct</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" onclick="resetFilters()" style="height: 45px;">Reset</button>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Requester</th>
                                    <th>Company</th>
                                    <th>Interests</th>
                                    <th>Preferred Date</th>
                                    <th>Status</th>
                                    <th>Assigned To</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="demoTableBody"></tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination"
                        style="margin-top: 20px; justify-content: flex-end;"></div>
                </div>

                <!-- Detail / Schedule Modal -->
                <div id="demoModal" class="modal">
                    <div class="modal-content glass" style="max-width: 700px;">
                        <div class="modal-header">
                            <h2 id="modalRequestId">Demo Request Detail</h2>
                            <button class="close-modal" onclick="closeModal('demoModal')">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div id="requestDetails" class="preview-grid" style="margin-bottom: 25px;"></div>

                            <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 20px 0;">

                            <h3>Schedule & Action</h3>
                            <div class="form-grid" style="margin-top: 15px;">
                                <div class="form-group">
                                    <label>Demo Date & Time</label>
                                    <input type="datetime-local" id="demoDateTime" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Assign To Team Member</label>
                                    <select id="demoAssignee" class="form-control"></select>
                                </div>
                                <div class="form-group" style="grid-column: span 2;">
                                    <label>Internal Notes</label>
                                    <textarea id="demoNotes" class="form-control" rows="3"
                                        placeholder="Additional context or scheduling details..."></textarea>
                                </div>
                                <div class="form-group" style="grid-column: span 2;">
                                    <label>Change Status</label>
                                    <select id="requestStatus" class="form-control">
                                        <option value="New">Keep as New</option>
                                        <option value="Scheduled">Scheduled</option>
                                        <option value="Completed">Completed</option>
                                        <option value="Cancelled">Cancelled</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer" style="margin-top: 20px;">
                            <button class="btn btn-primary" onclick="saveDemoUpdate()">Save Changes</button>
                        </div>
                    </div>
                </div>

                <!-- Create Modal -->
                <div id="createModal" class="modal">
                    <div class="modal-content glass">
                        <div class="modal-header">
                            <h2>New Demo Request</h2>
                            <button class="close-modal" onclick="closeModal('createModal')">&times;</button>
                        </div>
                        <form id="createForm" onsubmit="handleCreateRequest(event)">
                            <div class="preview-grid" style="grid-template-columns: 1fr 1fr;">
                                <div class="form-group">
                                    <label>Name *</label>
                                    <input type="text" id="newName" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Email *</label>
                                    <input type="email" id="newEmail" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Phone *</label>
                                    <input type="text" id="newPhone" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Company</label>
                                    <input type="text" id="newCompany" class="form-control">
                                </div>
                                <div class="form-group" style="grid-column: span 2;">
                                    <label>Product/Service Interest</label>
                                    <input type="text" id="newInterest" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Source</label>
                                    <select id="newSource" class="form-control">
                                        <option value="Website">Website</option>
                                        <option value="Email">Email</option>
                                        <option value="Campaign">Campaign</option>
                                        <option value="Direct">Direct</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer" style="margin-top: 20px;">
                                <button type="submit" class="btn btn-primary">Create Request</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/crm-demo.js"></script>
</body>

</html>
