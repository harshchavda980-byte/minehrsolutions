<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Applications — MineHR ATS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }

        .filter-row .form-group {
            flex: 1;
            min-width: 180px;
        }

        .status-new { background: #e0f2fe; color: #0369a1; }
        .status-reviewed { background: #fef9c3; color: #854d0e; }
        .status-interview-scheduled { background: #fae8ff; color: #86198f; }
        .status-hired { background: #dcfce7; color: #166534; }
        .status-rejected { background: #fee2e2; color: #991b1b; }

        .note-item {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            .filter-row { flex-direction: column; align-items: stretch; }
            .page-title { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .modal-content { width: 95% !important; padding: 15px !important; }
        }
    </style>
</head>

<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search candidates..." oninput="document.getElementById('searchInput').value = this.value; loadApplications(1)" />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1>Candidate Applications</h1>
                        <p>Track and manage candidate progress through the hiring funnel.</p>
                    </div>
                    <button class="btn btn-primary" onclick="openApplicationModal()">+ Add Lead</button>
                </div>

                <div class="filter-row">
                    <div class="form-group">
                        <label>Search Name/Email</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Candidate name or email..." oninput="loadApplications(1)">
                    </div>
                    <div class="form-group">
                        <label>Job Role</label>
                        <select id="jobFilter" class="form-control" onchange="loadApplications(1)">
                            <option value="">All Jobs</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusFilter" class="form-control" onchange="loadApplications(1)">
                            <option value="">All Statuses</option>
                            <option value="New">New</option>
                            <option value="Reviewed">Reviewed</option>
                            <option value="Interview Scheduled">Interview Scheduled</option>
                            <option value="Hired">Hired</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" onclick="resetFilters()" style="height: 45px;">Reset</button>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>APP ID</th>
                                    <th>Candidate</th>
                                    <th>Applied For</th>
                                    <th>Source</th>
                                    <th>Status</th>
                                    <th>Applied Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appTableBody"></tbody>
                        </table>
                    </div>
                    <div id="paginationControls" class="pagination" style="margin-top: 20px; justify-content: flex-end;"></div>
                </div>

                <!-- Add/Edit Application Modal -->
                <div id="appModal" class="modal">
                    <div class="modal-content glass" style="max-width: 550px;">
                        <div class="modal-header">
                            <h2 id="modalTitle">Add New Lead</h2>
                            <button class="close-modal" onclick="closeModal('appModal')">&times;</button>
                        </div>
                        <form id="appForm" onsubmit="handleAppSubmit(event)">
                            <div class="modal-body">
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                                    <div class="form-group" style="grid-column: span 2;">
                                        <label>Candidate Name *</label>
                                        <input type="text" id="candName" class="form-control" required placeholder="Full Name">
                                    </div>
                                    <div class="form-group">
                                        <label>Email *</label>
                                        <input type="email" id="candEmail" class="form-control" required placeholder="email@example.com">
                                    </div>
                                    <div class="form-group">
                                        <label>Phone</label>
                                        <input type="text" id="candPhone" class="form-control" placeholder="+91 XXXX">
                                    </div>
                                    <div class="form-group">
                                        <label>Applied Job *</label>
                                        <select id="jobSelect" class="form-control" required>
                                            <option value="">Select Job</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Source</label>
                                        <select id="candSource" class="form-control">
                                            <option value="Website">Website</option>
                                            <option value="LinkedIn">LinkedIn</option>
                                            <option value="Indeed">Indeed</option>
                                            <option value="Referral">Referral</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer" style="margin-top: 20px;">
                                <button type="submit" class="btn btn-primary" id="saveBtn">Save Candidate</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Details / Status Modal -->
                <div id="detailsModal" class="modal">
                    <div class="modal-content glass" style="max-width: 700px;">
                        <div class="modal-header">
                            <h2>Candidate Details</h2>
                            <button class="close-modal" onclick="closeModal('detailsModal')">&times;</button>
                        </div>
                        <div class="modal-body" id="detailsContent">
                            <!-- Populated via JS -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/ats-applications.js"></script>
</body>

</html>
