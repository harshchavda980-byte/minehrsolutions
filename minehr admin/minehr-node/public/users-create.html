                                    <option value="Europe/Berlin">(UTC+01:00) Amsterdam, Berlin, Rome, Paris</option>

                                    <option value="Asia/Tehran">(UTC+03:30) Tehran</option>
                                    <option value="Asia/Dubai">(UTC+04:00) Abu Dhabi, Muscat</option>

                                    <option value="Pacific/Noumea">(UTC+11:00) Magadan, Solomon Is., New Caledonia</option>
                                    <option value="Pacific/Auckland">(UTC+12:00) Auckland, Wellington, Fiji, Kamchatka</option>
                                    <option value="Pacific/Tongatapu">(UTC+13:00) Nuku'alofa</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label data-i18n="dev_label">Is developer use</label>
                                <select id="is_developer" class="form-control">
                                    <option value="false">No</option>
                                    <option value="true">Yes</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label data-i18n="password_label">Password</label>
                                <div style="position: relative;">
                                    <input type="password" id="password" class="form-control" required style="padding-right: 40px;">
                                    <span id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; height: 100%;">
                                        <svg id="eyeIconShow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                        <svg id="eyeIconHide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-eye-off" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>

                         <div id="errorMessage"
                             style="color: #ef4444 !important; font-weight: 600; margin: 12px 0; display: none; font-size: 14.5px;"></div>

                        <div style="display: flex; gap: 12px; margin-top: 25px;">
                            <button type="submit" class="btn btn-primary" style="padding: 12px 35px;" data-i18n="add_btn">Add User</button>

    <script src="js/admin.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth();

            // Setup Password Toggle
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIconShow = document.getElementById('eyeIconShow');
            const eyeIconHide = document.getElementById('eyeIconHide');
            
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'text') {
                    eyeIconShow.style.display = 'none';
                    eyeIconHide.style.display = 'block';
                } else {
                    eyeIconShow.style.display = 'block';
                    eyeIconHide.style.display = 'none';
                }
            });

            // Country Code & Phone Validation Logic
            const countryCodesList = [
                { code: '+91', country: 'India', length: 10 },
                { code: '+1', country: 'US/Canada', length: 10 },
                { code: '+44', country: 'UK', length: 10 },
                { code: '+61', country: 'Australia', length: 9 },
                { code: '+81', country: 'Japan', length: 10 },
                { code: '+86', country: 'China', length: 11 },
                { code: '+49', country: 'Germany', length: 11 },
                { code: '+33', country: 'France', length: 9 },
                { code: '+55', country: 'Brazil', length: 11 },
                { code: '+971', country: 'UAE', length: 9 },
                { code: '+65', country: 'Singapore', length: 8 }
            ];

             const ccOptionsContainer = document.querySelector('.custom-cc-options');
             const ccDisplay = document.getElementById('cc-display');
             const ccInput = document.getElementById('country_code');
             const ccTrigger = document.querySelector('.custom-cc-trigger');
             const phoneInput = document.getElementById('phone_number');
             const hiddenPhone = document.getElementById('phone');

             let selectedCountryCodeObj = countryCodesList[0];

             let ccHTML = '';
             countryCodesList.forEach(c => {
                 ccHTML += `<div class="custom-cc-option" data-code="${c.code}" data-length="${c.length}" data-country="${c.country}" style="padding: 10px 12px; cursor: pointer; color: var(--text-primary); transition: background 0.2s; display: flex; justify-content: space-between; align-items: center; font-size: 13px;">
                     <span>${c.code} (${c.country})</span>
                 </div>`;
             });
             ccOptionsContainer.innerHTML = ccHTML;

             ccTrigger.addEventListener('click', (e) => {
                 e.stopPropagation();
                 const isVisible = ccOptionsContainer.style.display === 'block';
                 ccOptionsContainer.style.display = isVisible ? 'none' : 'block';
             });

             document.addEventListener('click', (e) => {
                 if (!e.target.closest('.custom-cc-wrapper')) {
                     ccOptionsContainer.style.display = 'none';
                 }
             });

             function selectCountryCode(code) {
                 const found = countryCodesList.find(c => c.code === code);
                 if (found) {
                     selectedCountryCodeObj = found;
                     ccInput.value = found.code;
                     ccDisplay.textContent = `${found.code} (${found.country})`;
                     
                     if (phoneInput.value.length > found.length) {
                         phoneInput.value = phoneInput.value.slice(0, found.length);
                     }

                     ccOptionsContainer.querySelectorAll('.custom-cc-option').forEach(opt => {
                         if (opt.getAttribute('data-code') === found.code) {
                             opt.style.background = 'rgba(99, 102, 241, 0.2)';
                         } else {
                             opt.style.background = 'transparent';
                         }
                     });
                     
                     updatePhoneValidation();
                 }
             }

             ccOptionsContainer.addEventListener('click', (e) => {
                 const option = e.target.closest('.custom-cc-option');
                 if (option) {
                     const code = option.getAttribute('data-code');
                     selectCountryCode(code);
                     ccOptionsContainer.style.display = 'none';
                 }
             });

             ccOptionsContainer.querySelectorAll('.custom-cc-option').forEach(opt => {
                 opt.addEventListener('mouseenter', () => {
                     if (opt.getAttribute('data-code') !== selectedCountryCodeObj.code) {
                         opt.style.background = 'var(--glass-bg)';
                     }
                 });
                 opt.addEventListener('mouseleave', () => {
                     if (opt.getAttribute('data-code') === selectedCountryCodeObj.code) {
                         opt.style.background = 'rgba(99, 102, 241, 0.2)';
                     } else {
                         opt.style.background = 'transparent';
                     }
                 });
             });

             function updatePhoneValidation() {
                 const len = selectedCountryCodeObj.length;
                 phoneInput.setAttribute('maxlength', len);
                 phoneInput.setAttribute('minlength', len);
                 phoneInput.placeholder = 'Enter ' + len + ' digits';
                 updateHiddenPhone();
             }

             function updateHiddenPhone() {
                 hiddenPhone.value = selectedCountryCodeObj.code + ' ' + phoneInput.value;
             }

             phoneInput.addEventListener('input', (e) => {
                 e.target.value = e.target.value.replace(/\D/g, '');
                 updateHiddenPhone();
             });

             selectCountryCode('+91');

            // Fetch active roles
            try {
                const roleRes = await fetch('/api/roles');
                if (roleRes.ok) {
                    const roles = await roleRes.json();
                    const roleSelect = document.getElementById('role');
                    const submitBtn = document.querySelector('button[type="submit"]');
                    
                    if (roles.length === 0) {
                        roleSelect.innerHTML = '<option value="">No roles defined. Please create one first.</option>';
                        roleSelect.disabled = true;
                        submitBtn.disabled = true;
                        submitBtn.style.opacity = '0.5';
                        submitBtn.title = 'Please define at least one role in Manage Roles first.';
                    } else {
                        roleSelect.innerHTML = roles.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
                        roleSelect.disabled = false;
                        submitBtn.disabled = false;
                        submitBtn.style.opacity = '1';
                    }
                }
            } catch (err) {
                console.error("Failed to fetch roles", err);
            }

            // Populate all countries custom dropdown
            const allWorldCountries = [
                "Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua and Barbuda", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan", "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia and Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria", "Burkina Faso", "Burundi", "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad", "Chile", "China", "Colombia", "Comoros", "Congo, Democratic Republic of the", "Congo, Republic of the", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czech Republic", "Denmark", "Djibouti", "Dominica", "Dominican Republic", "East Timor", "Ecuador", "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia", "Fiji", "Finland", "France", "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau", "Guyana", "Haiti", "Honduras", "Hungary", "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Ivory Coast", "Jamaica", "Japan", "Jordan", "Kazakhstan", "Kenya", "Kiribati", "Korea, North", "Korea, South", "Kosovo", "Kuwait", "Kyrgyzstan", "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania", "Luxembourg", "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique", "Myanmar", "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria", "North Macedonia", "Norway", "Oman", "Pakistan", "Palau", "Palestine", "Panama", "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal", "Qatar", "Romania", "Russia", "Rwanda", "Saint Kitts and Nevis", "Saint Lucia", "Saint Vincent and the Grenadines", "Samoa", "San Marino", "Sao Tome and Principe", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore", "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Sudan", "Spain", "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria", "Taiwan", "Tajikistan", "Tanzania", "Thailand", "Togo", "Tonga", "Trinidad and Tobago", "Tunisia", "Turkey", "Turkmenistan", "Tuvalu", "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay", "Uzbekistan", "Vanuatu", "Vatican City", "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabwe"
            ];
            
            const optionsContainer = document.querySelector('.custom-select-options');
            const displaySpan = document.getElementById('country-display');
            const hiddenInput = document.getElementById('countries');
            const trigger = document.querySelector('.custom-select-trigger');
            const searchInput = document.getElementById('country-search');
            let selectedCountries = [];

            function renderSelectedCountries() {
                if (selectedCountries.length === 0) {
                    displaySpan.innerHTML = '';
                    searchInput.placeholder = 'All Regions / Global';
                    hiddenInput.value = '';
                } else {
                    displaySpan.innerHTML = selectedCountries.map(c => `
                        <span class="country-tag" style="background: rgba(99, 102, 241, 0.25); border: 1px solid rgba(99, 102, 241, 0.5); color: #c7d2fe; padding: 2px 8px; border-radius: 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; margin: 2px 0;">
                            ${c}
                            <span class="remove-tag" data-value="${c}" style="cursor: pointer; font-weight: bold; color: #f87171; font-size: 14px; line-height: 1;">&times;</span>
                        </span>
                    `).join('');
                    searchInput.placeholder = '';
                    hiddenInput.value = selectedCountries.join(',');
                }
                
                // Update selected styles of items
                const options = optionsContainer.querySelectorAll('.custom-option');
                options.forEach(opt => {
                    const val = opt.getAttribute('data-value');
                    const checkIcon = opt.querySelector('.check-icon');
                    if (val === '') {
                        if (selectedCountries.length === 0) {
                            opt.style.background = 'rgba(99, 102, 241, 0.2)';
                            if (checkIcon) checkIcon.style.opacity = '1';
                        } else {
                            opt.style.background = 'transparent';
                            if (checkIcon) checkIcon.style.opacity = '0';
                        }
                    } else {
                        if (selectedCountries.includes(val)) {
                            opt.style.background = 'rgba(99, 102, 241, 0.2)';
                            if (checkIcon) checkIcon.style.opacity = '1';
                        } else {
                            opt.style.background = 'transparent';
                            if (checkIcon) checkIcon.style.opacity = '0';
                        }
                    }
                });
            }

            let optionsHTML = `<div class="custom-option" data-value="" style="padding: 10px 12px; cursor: pointer; color: var(--text-primary); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;">
                <span>All Regions / Global</span>
                <span class="check-icon" style="opacity: 0; color: #818cf8; font-weight: bold;">✓</span>
            </div>`;
            
            allWorldCountries.forEach(countryName => {
                optionsHTML += `<div class="custom-option" data-value="${countryName}" style="padding: 10px 12px; cursor: pointer; color: var(--text-primary); transition: background 0.2s; display: flex; justify-content: space-between; align-items: center;">
                    <span>${countryName}</span>
                    <span class="check-icon" style="opacity: 0; color: #818cf8; font-weight: bold;">✓</span>
                </div>`;
            });
            optionsContainer.innerHTML = optionsHTML;

            // Trigger click to toggle dropdown panel
            trigger.addEventListener('click', (e) => {
                if (e.target.closest('.remove-tag')) {
                    return;
                }
                e.stopPropagation();
                const isVisible = optionsContainer.style.display === 'block';
                optionsContainer.style.display = isVisible ? 'none' : 'block';
                if (!isVisible) {
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                    searchInput.focus();
                }
            });

            // Prevent closing dropdown when clicking inside search input
            searchInput.addEventListener('click', (e) => {
                e.stopPropagation();
                optionsContainer.style.display = 'block';
            });

            // Handle option selection
            optionsContainer.addEventListener('click', (e) => {
                const option = e.target.closest('.custom-option');
                if (option) {
                    e.stopPropagation();
                    const val = option.getAttribute('data-value');
                    if (val === '') {
                        // "All Regions / Global" selected
                        selectedCountries = [];
                    } else {
                        const index = selectedCountries.indexOf(val);
                        if (index > -1) {
                            selectedCountries.splice(index, 1);
                        } else {
                            selectedCountries.push(val);
                        }
                    }
                    renderSelectedCountries();
                    searchInput.value = '';
                    searchInput.dispatchEvent(new Event('input'));
                    searchInput.focus();
                }
            });

            // Remove tag dynamically from input trigger area
            displaySpan.addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.remove-tag');
                if (removeBtn) {
                    e.stopPropagation();
                    const val = removeBtn.getAttribute('data-value');
                    selectedCountries = selectedCountries.filter(c => c !== val);
                    renderSelectedCountries();
                    searchInput.focus();
                }
            });

            // Backspace deletes the last tag if input is empty
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && searchInput.value === '' && selectedCountries.length > 0) {
                    selectedCountries.pop();
                    renderSelectedCountries();
                }
            });

            // Click outside to close
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.custom-select-wrapper')) {
                    optionsContainer.style.display = 'none';
                }
            });

            // Search filter functionality
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const options = optionsContainer.querySelectorAll('.custom-option');
                options.forEach(opt => {
                    const val = opt.getAttribute('data-value');
                    const text = opt.textContent.toLowerCase();
                    if (val === '') {
                        opt.style.display = query === '' ? 'flex' : 'none';
                    } else {
                        if (text.includes(query)) {
                            opt.style.display = 'flex';
                        } else {
                            opt.style.display = 'none';
                        }
                    }
                });
            });

            // Hover state styling dynamically
            optionsContainer.querySelectorAll('.custom-option').forEach(opt => {
                opt.addEventListener('mouseenter', () => {
                    if (!opt.classList.contains('selected') && opt.style.background !== 'rgba(99, 102, 241, 0.2)') {
                        opt.style.background = 'var(--glass-bg)';
                    }
                });
                opt.addEventListener('mouseleave', () => {
                    const val = opt.getAttribute('data-value');
                    if (val === '') {
                        if (selectedCountries.length === 0) {
                            opt.style.background = 'rgba(99, 102, 241, 0.2)';
                        } else {
                            opt.style.background = 'transparent';
                        }
                    } else {
                        if (selectedCountries.includes(val)) {
                            opt.style.background = 'rgba(99, 102, 241, 0.2)';
                        } else {
                            opt.style.background = 'transparent';
                        }
                    }
                });
            });

            renderSelectedCountries();

            if (userId) {
                document.querySelector('.page-title h1').innerText = 'Edit User';
                document.querySelector('.page-title h1').setAttribute('data-i18n', 'edit_title');
                document.querySelector('.page-title p').innerText = 'Update system access for an existing administrator or manager';
                document.querySelector('.page-title p').setAttribute('data-i18n', 'edit_subtitle');
                document.querySelector('button[type="submit"]').innerText = 'Update User';
                document.querySelector('button[type="submit"]').setAttribute('data-i18n', 'update_btn');
                
                // Fetch user data
                try {
                    const res = await fetch('/api/auth/users/' + userId);
                    if (res.ok) {
                        const user = await res.json();
                        document.getElementById('name').value = user.name || '';
                        document.getElementById('email').value = user.email || '';
                        document.getElementById('role').value = user.role || 'Standard User';
                        if (user.phone) {
                            let phoneStr = user.phone;
                            let foundCode = '+91';
                            for (let c of countryCodesList) {
                                if (phoneStr.startsWith(c.code)) {
                                    foundCode = c.code;
                                    phoneStr = phoneStr.substring(c.code.length).trim();
                                    break;
                                }
                            }
                            selectCountryCode(foundCode);
                            document.getElementById('phone_number').value = phoneStr;
                            updatePhoneValidation();
                        }
                        if (user.countries) {
                            selectedCountries = user.countries.split(',').map(c => c.trim()).filter(Boolean);
                        } else {
                            selectedCountries = [];
                        }
                        renderSelectedCountries();
                        document.getElementById('fcm_notifications').value = user.fcm_notifications ? 'true' : 'false';
                        document.getElementById('language').value = user.language || 'English';
                        document.getElementById('language').dispatchEvent(new Event('change'));
                        document.getElementById('timezone').value = user.timezone || 'UTC';
                        document.getElementById('is_developer').value = user.is_developer ? 'true' : 'false';
                        
                        // Password is left blank on edit
                        document.getElementById('password').required = false;
                        document.getElementById('password').placeholder = 'Leave blank to keep current password';
                    }
                } catch (err) {
                    console.error('Failed to load user data');
                }
            }
        });

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            const phone = document.getElementById('phone').value;
            const countries = document.getElementById('countries').value;
            const fcm_notifications = document.getElementById('fcm_notifications').value === 'true';
            const language = document.getElementById('language').value;
            const timezone = document.getElementById('timezone').value;
            const is_developer = document.getElementById('is_developer').value === 'true';
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');

            const payload = {
                name, email, role, phone, countries,
                fcm_notifications, language, timezone,
                is_developer
            };
            if (password) payload.password = password;

            try {
                const url = userId ? '/api/auth/users/' + userId : '/api/auth/register';
                const method = userId ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    window.location.href = 'users.html';
                } else {
                    const data = await res.json();
                    errorMessage.innerText = data.message || (userId ? 'Failed to update user' : 'Failed to create user');
                    errorMessage.style.display = 'block';
                }
            } catch (err) {
                errorMessage.innerText = 'Something went wrong';
                errorMessage.style.display = 'block';
            }
        });

    </script>
    <script>
        const translations = {
            'English': {
                title: 'Create New User', subtitle: 'Grant system access to a new administrator or manager',
                name_label: 'Name', name_placeholder: 'Enter Full Name', role_label: 'Role',
                phone_label: 'Mobilenumber: Country/Number', email_label: 'Email',

            },
            'Hindi': {

                name_label: 'नाम', name_placeholder: 'पूरा नाम दर्ज करें', role_label: 'भूमिका',
                phone_label: 'मोबाइल नंबर: देश/नंबर', email_label: 'ईमेल',
                country_label: 'देश एक्सेस:', fcm_label: 'FCM सूचनाएं:',
                language_label: 'भाषा', timezone_label: 'समय क्षेत्र',
                dev_label: 'डेवलपर उपयोग है', password_label: 'पासवर्ड',
                add_btn: 'उपयोगकर्ता जोड़ें', cancel_btn: 'रद्द करें',
                edit_title: 'उपयोगकर्ता संपादित करें', edit_subtitle: 'मौजूदा व्यवस्थापक के लिए सिस्टम एक्सेस अपडेट करें', update_btn: 'उपयोगकर्ता अपडेट करें'

            'Gujarati': {

                phone_label: 'મોબાઇલ નંબર: દેશ/નંબર', email_label: 'ઇમેઇલ',
                country_label: 'દેશ એક્સેસ:', fcm_label: 'FCM સૂચનાઓ:',
                language_label: 'ભાષા', timezone_label: 'સમય ઝોન',
                dev_label: 'ડેવલપર ઉપયોગ છે', password_label: 'પાસવર્ડ',
                add_btn: 'વપરાશકર્તા ઉમેરો', cancel_btn: 'રદ કરો',
                edit_title: 'વપરાશકર્તા સંપાદિત કરો', edit_subtitle: 'હાલના એડમિનિસ્ટ્રેટર માટે સિસ્ટમ એક્સેસ અપડેટ કરો', update_btn: 'વપરાશકર્તા અપડેટ કરો'
            }
        };

        function updateLanguage(lang) {
            if (!translations[lang]) return;
            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerText = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.setAttribute('placeholder', t[key]);
            });
        }

        document.getElementById('language').addEventListener('change', function(e) {
            updateLanguage(e.target.value);
        });
    </script>
