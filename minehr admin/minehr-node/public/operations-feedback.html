<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback & Escalation — MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .status-new {
            border-left: 4px solid #3b82f6;
        }

        .status-in-progress {
            border-left: 4px solid #f59e0b;
        }

        .status-escalated {
            border-left: 4px solid #ef4444;
        }

        .status-resolved {
            border-left: 4px solid #10b981;
        }

        .filters-panel {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 15px;
            margin-bottom: 25px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            align-items: flex-end;
        }

        .pagination {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            cursor: pointer;
            transition: 0.3s;
        }

        .pagination button.active {
            background: var(--primary);
            color: white;
        }

        .badge-escalated {
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
        }
    </style>
</head>

<body>
    <div class="admin-layout">
                <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav">
                <!-- Sidebar content injected by sidebar.js -->
            </nav>
        </aside>
        <main class="main main-content">
                        <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo">
                        <img src="logo.png" alt="MineHR Logo" />
                    </a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="topbarSearch" oninput="document.getElementById('searchInput').value = this.value; filterFeedback()" placeholder="Search feedback..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span>
                        <span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div style="text-align: right; display: flex; flex-direction: column;">
                                <span id="userName" style="font-size: 14px; font-weight: 600;">Admin</span>
                                <span id="userRole" style="font-size: 11px; color: var(--text-muted);">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin"
                                style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>
            <section class="content active-page">
                <div class="page-title">
                    <h1>Operations / Feedback Escalation</h1>
                    <p>Manage website inquiries and handle escalations.</p>
                </div>

                <div class="filters-panel">
                    <div class="form-group">
                        <label>Search Name / Email / Subject</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search..."
                            oninput="filterFeedback()">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusFilter" class="form-control" onchange="filterFeedback()">
                            <option value="">All Statuses</option>
                            <option value="New">New</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Escalated">Escalated</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Start Date</label>
                        <input type="date" id="startDate" class="form-control" onchange="filterFeedback()">
                    </div>
                    <div class="form-group">
                        <label>End Date</label>
                        <input type="date" id="endDate" class="form-control" onchange="filterFeedback()">
                    </div>
                    <button class="btn btn-outline" onclick="resetFilters()" style="height: 45px;">Reset</button>
                </div>

                <!-- Feedback Detail Modal -->
                <div id="feedbackModal" class="modal">
                    <div class="modal-content glass">
                        <div class="modal-header">
                            <h2 id="modalFeedbackId">Feedback Details</h2>
                            <button class="close-modal" onclick="closeModal()">&times;</button>
                        </div>
                        <div id="modalContent">
                            <div class="preview-grid">
                                <div class="preview-item">
                                    <span>Submitter Name</span>
                                    <p id="detName"></p>
                                </div>
                                <div class="preview-item">
                                    <span>Contact Info</span>
                                    <p id="detContact"></p>
                                </div>
                                <div class="preview-item">
                                    <span>Subject</span>
                                    <p id="detSubject"></p>
                                </div>
                                <div class="preview-item">
                                    <span>Date Received</span>
                                    <p id="detDate"></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Feedback Message</label>
                                <div id="detMessage" class="panel" style="margin-top: 5px; background: rgba(0,0,0,0.2);"></div>
                            </div>
                            <div id="escalationHistorySection" style="margin-top: 20px;">
                                <label>Escalation History</label>
                                <div id="escalationTimeline" style="margin-top: 10px;"></div>
                            </div>
                            <div class="modal-footer" style="margin-top: 30px; display: flex; gap: 10px; justify-content: flex-end;">
                                <button id="modalEscalateBtn" class="btn btn-outline warning">Escalate</button>
                                <button id="modalResolveBtn" class="btn btn-primary success">Mark Resolved</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="premium-table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Submitter</th>
                                    <th>Subject & Message</th>
                                    <th>Company</th>
                                    <th>Status</th>
                                    <th>Assigned To</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="feedbackTableBody">
                                <!-- Data will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination" id="paginationControls"></div>
                </div>
            </section>
        </main>
    </div>
    <script src="js/sidebar.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/feedback.js"></script>
</body>

</html>
