<!DOCTYPE html>
<html lang="en">

<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <title>Access Control — MineHR Master</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
</head>

<body>
    <div class="page-loader" id="pageLoader"></div>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="MineHR Logo" class="brand-logo" />
            </div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <a href="dashboard.html" class="topbar-logo"><img src="logo.png" alt="MineHR Logo" /></a>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="searchInput" oninput="filterRoles()" placeholder="Search roles..." />
                        <span class="search-key">/</span>
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">☀️</span><span class="moon">🌙</span>
                        <div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div>
                                <span id="userName" style="font-weight:700;">Admin</span>
                                <span id="userRole" style="font-size:11px;color:var(--text-muted);font-weight:600;">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" alt="Admin" style="width:42px;height:42px;border-radius:14px;border:2px solid var(--glass-border);" />
                        </div>
                        <div class="profile-menu">
                            <div class="profile-info">
                                <strong id="profileMenuName">Admin</strong>
                                <p id="profileMenuEmail">admin@minehr.com</p>
                            </div>
                            <a href="settings.html" class="profile-menu-item">Settings</a>
                            <button class="profile-menu-item" onclick="window.location.reload()">Refresh Page</button>
                            <div class="profile-divider"></div>
                            <button id="logoutBtn" class="profile-menu-item danger">Logout System</button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="page-title">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h1>Admins & Roles</h1>
                            <p>Define system access tiers and permission boundaries</p>
                        </div>
                        <a href="role-create.html" class="btn btn-primary">Define New Role</a>
                    </div>
                </div>

                <div class="cards" id="rolesGrid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                    <!-- Roles will be loaded here -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        

        async function fetchRoles() {
            try {
                const res = await fetch('/api/roles');
                const roles = await res.json();
                
                const grid = document.getElementById('rolesGrid');
                if (!roles.length) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No roles defined. Create one to get started.</div>';
                    return;
                }

                grid.innerHTML = roles.map(role => {
                    const isSystem = role.name === 'Super Admin';
                    return `
                    <div class="card" style="border-top: 4px solid var(--primary);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h3 style="color: var(--text-primary); margin: 0; text-transform: uppercase;">${role.name}</h3>
                            <div style="display: flex; gap: 5px;">
                                ${isSystem ? '<span class="badge" style="background: rgba(99, 102, 241, 0.2); color: var(--primary); border: 1px solid var(--primary);">SYSTEM</span>' : ''}
                                <span class="badge" style="background: rgba(255, 255, 255, 0.05);">${(role.permissions || []).length} Perms</span>
                            </div>
                        </div>
                        <p style="font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; min-height: 50px; line-height: 1.6;">${role.description || 'No description available.'}</p>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="window.location.href='role-create.html?id=${role.id}'" class="btn btn-primary" style="flex: 1; justify-content: center;">${isSystem ? 'View Permissions' : 'Configure Role'}</button>
                            ${!isSystem ? `<button onclick="deleteRole(${role.id})" class="btn btn-outline" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.2);">Delete</button>` : ''}
                        </div>
                    </div>
                `}).join('');
            } catch (err) {
                console.error('Error fetching roles:', err);
            }
        }

        async function deleteRole(id) {
            if (confirm('Are you sure you want to delete this role?')) {
                try {
                    const res = await fetch(`/api/roles/${id}`, { method: 'DELETE' });
                    if (res.ok) {
                        fetchRoles();
                    }
                } catch (err) { console.error(err); }
            }
        }

        function filterRoles() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(filter) ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            fetchRoles();
        });
    </script>
</body>

</html>
