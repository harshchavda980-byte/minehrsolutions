<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Reports &mdash; MineHR Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
        }
        
        /* Unified Categories Grid */
        .report-submodules-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }
        @media (max-width: 1200px) {
            .report-submodules-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .report-submodules-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .category-header {
            font-size: 13.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            margin: 35px 0 16px 0;
            padding-left: 10px;
            border-left: 3px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .submodule-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        
        .submodule-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }
        
        .light .submodule-card {
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }
        
        .light .submodule-card:hover {
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.3);
        }
        
        .submodule-card.active {
            background: rgba(99, 102, 241, 0.08);
            border: 2px solid var(--primary);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
        }
        
        .light .submodule-card.active {
            background: rgba(99, 102, 241, 0.04);
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.08);
        }
        
        .submodule-icon-box {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .submodule-card:hover .submodule-icon-box {
            background: var(--primary);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        
        .submodule-card.active .submodule-icon-box {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        
        .submodule-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            text-align: left;
        }
        
        .submodule-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .submodule-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Stats Pill Grid */
        .report-stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 25px;
        }
        @media (max-width: 768px) {
            .report-stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .report-stat-card {
            background: var(--bg-panel);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }
        .report-stat-card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .light .report-stat-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }
        .stat-card-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-card-value {
            font-size: 26px;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        
        /* Premium Filter Bar */
        .filter-bar {
            display: flex;
            gap: 20px;
            background: var(--bg-panel);
            padding: 22px 26px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            margin-bottom: 25px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        
        /* Premium Table Grid */
        .data-table-container {
            background: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: var(--panel-shadow);
        }
        
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        table.data-table th {
            background: rgba(0, 0, 0, 0.15);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .light table.data-table th {
            background: rgba(0, 0, 0, 0.02);
        }
        
        table.data-table td {
            padding: 16px 24px;
            font-size: 13.5px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }
        
        table.data-table tbody tr {
            transition: all 0.2s;
        }
        
        table.data-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.015);
        }
        .light table.data-table tbody tr:hover {
            background: rgba(0, 0, 0, 0.01);
        }
        
        table.data-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-pending { background: rgba(245, 158, 11, 0.12); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-approved { background: rgba(16, 185, 129, 0.12); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-rejected { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .btn-premium-outline {
            padding: 10px 22px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            background: var(--bg-panel);
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-premium-outline:hover {
            border-color: var(--primary);
            color: #fff;
            background: var(--primary);
            box-shadow: 0 4px 14px var(--primary-glow);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="brand"><img src="logo.png" alt="MineHR Logo" class="brand-logo" /></div>
            <nav id="sidebarNav"></nav>
        </aside>

        <main class="main main-content">
            <header class="topbar">
                <div class="topbar-left">
                    <div class="sidebar-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" placeholder="Search report data..." id="reportSearch" />
                    </div>
                </div>
                <div class="topbar-right">
                    <div class="theme-toggle" onclick="toggleTheme()">
                        <span class="sun">&#9728;&#65039;</span><span class="moon">&#127769;</span><div class="toggle-ball"></div>
                    </div>
                    <div class="profile" id="profileDropdown">
                        <div class="profile-trigger" onclick="toggleProfileMenu()">
                            <div style="text-align: right; display: flex; flex-direction: column;">
                                <span id="userName" style="font-size: 14px; font-weight: 600;">Admin</span>
                                <span id="userRole" style="font-size: 11px; color: var(--text-muted);">Super Admin</span>
                            </div>
                            <img id="userAvatar" src="https://ui-avatars.com/api/?name=Admin&background=6366f1&color=fff" style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid var(--glass-border);" />
                        </div>
                    </div>
                </div>
            </header>

            <section class="content active-page">
                <div class="report-header">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="width: 52px; height: 52px; border-radius: 14px; background: rgba(99, 102, 241, 0.12); display: flex; align-items: center; justify-content: center; color: var(--primary); flex-shrink: 0; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);">
                            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                <polyline points="10 9 9 9 8 9"></polyline>
                            </svg>
                        </div>
                        <div>
                            <h1 id="reportTitle" style="font-size: 2.5rem; font-weight: 800; letter-spacing: -1.5px; font-family: 'Outfit', sans-serif; margin: 0; line-height: 1.1;">Tracking Reports</h1>
                            <p id="reportDesc" style="color: var(--text-secondary); margin-top: 5px; font-size: 14px;">Generate and export employee tracking reports.</p>
                        </div>
                    </div>
                    <!-- Actions configured exactly as shown in screenshot -->
                    <div class="actions" style="display: flex; gap: 10px;">
                        <button class="btn-premium-outline">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                            Import Data
                        </button>
                        <button class="btn-premium-outline" onclick="exportData('csv')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Export
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="margin-left: 2px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                    </div>
                </div>

                <!-- HORIZONTAL SUB-MODULES NAV ROW -->
                <div id="reportSubmodulesContainer"></div>

                <!-- PREMIUM QUICK STATS GRID -->
                <div class="report-stats-grid">
                    <div class="report-stat-card">
                        <span class="stat-card-label">Total Records</span>
                        <strong id="statTotalRecords" class="stat-card-value">0</strong>
                    </div>
                    <div class="report-stat-card">
                        <span class="stat-card-label">Reporting Period</span>
                        <strong class="stat-card-value">LAST 30 DAYS</strong>
                    </div>
                    <div class="report-stat-card">
                        <span class="stat-card-label">Security & Integrity</span>
                        <strong class="stat-card-value" style="color: #10b981; display: flex; align-items: center; gap: 6px;">
                            VERIFIED <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:#10b981;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        </strong>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label style="display:block; font-size: 11px; font-weight:800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">DATE RANGE</label>
                        <div style="display:flex; gap:10px;">
                            <input type="date" class="form-control" id="dateFrom" style="height: 42px;">
                            <input type="date" class="form-control" id="dateTo" style="height: 42px;">
                        </div>
                    </div>
                    <div style="width: 220px;">
                        <label style="display:block; font-size: 11px; font-weight:800; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">STATUS</label>
                        <select class="form-control" id="statusFilter" style="height: 42px;">
                            <option value="">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" style="padding: 11px 30px; border-radius: 12px; height: 42px;" onclick="loadReportData()">Generate</button>
                </div>

                <div class="data-table-container">
                    <table class="data-table" id="reportTable">
                        <thead id="tableHead">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="tableBody">
                            <!-- Injected by JS -->
                            <tr><td colspan="100%" style="text-align:center; padding:100px; color:var(--text-muted);">Generating report data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/tracking-reports.js"></script>

</body>
</html>
